# Pinned sources for the application fixtures (tests/apps/<app>/fixture).
# Same discipline as deps/versions.lock and php/pgo/corpus.lock: nothing is
# fetched without a version and a sha256 (prestashop-lang rows excepted, see
# below), and build-fixture.sh's `fetch` helper refuses a row that is missing
# or ambiguous.
#
# Rows are keyed by (name, set). `-` in the set column means "any set" and is
# only used for tools shared by every app (composer, wp-cli). A docker://
# url pins an image by manifest digest: the sha256 column is that digest.
#
# composer 2.2 is the LTS line and the last one that runs below PHP 7.2.5, so
# the 7.0/7.1 fixtures install with it; everything else uses current 2.x.
#
# name            set   version     sha256                                                            url
composer-lts      -     2.2.30      8c2b4478b64f8f7cdf1574838fdb0033b29049ca821dad452db7a3dcfcdbffc2  https://getcomposer.org/download/2.2.30/composer.phar
composer          -     2.10.3      7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6  https://getcomposer.org/download/2.10.3/composer.phar
#
# PrestaShop: the release tree comes from the vendor's own Docker image, since
# download.prestashop.com and GitHub release assets are unreachable from here
# (php/pgo/corpus.lock has the long version). The sha256 column of an image row
# is the manifest digest; host-prep.sh streams /var/www/html out of it. The
# -8.1 tag is the newest PrestaShop that still runs on the set's php-min.
prestashop-image     9.2  9.2.0  a862e53476bb32816780101cc333f8997045e5b0dd809c5df6e5b4d32ed7dd73  docker://prestashop/prestashop:9.2.0-8.1
# The installer downloads the en-US pack even for English, with no offline path.
# Upstream re-exports these zips in place with every release, so the lang rows
# are `latest`: fetch.sh checks the zip's shape (en-US/*.xlf only) instead of a
# hash and logs the sha256 it got (php/pgo/corpus.lock has the history).
prestashop-lang      9.2  9.2.0  latest  https://i18n.prestashop-project.org/translations/9.2.0/en-US/en-US.zip
# The release image ships composer.lock but no composer.json; the tag's own file
# is what the lock's content-hash was made from and what suite/builder.sh needs.
prestashop-composer  9.2  9.2.0  860dd9121869142b40aa9b068f6e57b025b554bfd9f15902bafc669790e0cffb  https://raw.githubusercontent.com/PrestaShop/PrestaShop/9.2.0/composer.json
# 8.2: the newest 8.2.x patch; the -7.2-fpm tag is the newest image built for the
# set's php-min.
prestashop-image     8.2  8.2.8  0c666c1dcd821d2484df553bc2250acabf5d905097ae271dbc0e1363b30d2c66  docker://prestashop/prestashop:8.2.8-7.2-fpm
prestashop-lang      8.2  8.2.8  latest  https://i18n.prestashop-project.org/translations/8.2.8/en-US/en-US.zip
prestashop-composer  8.2  8.2.8  aa188d86fa4301e13f478c4258ea9fed1a2e8d87ba27615d2b78e77defbe5434  https://raw.githubusercontent.com/PrestaShop/PrestaShop/8.2.8/composer.json
# 1.7: the last 1.7.8 patch (PS_VERSION inside the image, checked); -7.1-fpm is the
# tag built for the set's php-min and 1.7.8 declares php ^7.1.3 (config.platform 7.1.3).
prestashop-image     1.7  1.7.8.11  25a4fa68ab0529a5886f45ea9aad04d2626f7c1b861c62cbe643d2574a8e6473  docker://prestashop/prestashop:1.7.8.11-7.1-fpm
prestashop-lang      1.7  1.7.8.11  latest  https://i18n.prestashop-project.org/translations/1.7.8.11/en-US/en-US.zip
prestashop-composer  1.7  1.7.8.11  e93e62f2f853ead75d5a0d514e18a714f1df75f965fc099adeb3def4c73356f4  https://raw.githubusercontent.com/PrestaShop/PrestaShop/1.7.8.11/composer.json
# 1.6: the only PrestaShop that runs on php 7.0 -- no 1.7 release ever supported it (php/pgo/corpus.lock has the long
# version). Docker Hub publishes it only as the floating tag 1.6-7.0-fpm, so the digest is the pin; PS_VERSION inside the
# image is 1.6.1.24 (checked). No prestashop-lang row (1.6 installs English from its own tree) and no prestashop-composer
# row (1.6 has no composer.json or lock).
prestashop-image     1.6  1.6.1.24  fd757ab1a4847abc053f19dfbf0f4885ffbf4fc06b02bce04035f30c952e234f  docker://prestashop/prestashop:1.6-7.0-fpm
