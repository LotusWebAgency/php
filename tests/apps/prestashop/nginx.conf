# PrestaShop 1.7, 8.2 and 9.x behind php-fpm: the friendly-URL rules are the .htaccess
# Tools::generateHtaccess() writes (rewrite=1), translated the way PrestaShop's
# own nginx documentation does it. One file serves all: 9.x's category image
# rules (the _thumb suffix) are a superset of 8.2's and 1.7's.
server {
  listen 80 default_server;
  server_name apptest.test;
  root /srv/app;
  index index.php;

  client_max_body_size 64m;
  # PrestaShop puts a lot into cookies and response headers (the profiler and
  # cache-tag headers of the Symfony pages in particular).
  large_client_header_buffers 4 32k;
  fastcgi_buffers 32 32k;
  fastcgi_buffer_size 64k;
  fastcgi_busy_buffers_size 128k;
  fastcgi_read_timeout 300s;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Webservice
  rewrite ^/api(?:/(.*))?$ /webservice/dispatcher.php?url=$1 last;
  rewrite ^/upload/.+$ /index.php last;

  # Friendly image URLs: /<id>-<type>/<slug>.jpg -> img/p/1/2/3/<id>-<type>.jpg
  rewrite ^/(([\d])(?:\-[\w-]*)?)/.+(\.(?:jpe?g|webp|png|avif))$ /img/p/$2/$1$3 last;
  rewrite ^/(([\d])([\d])(?:\-[\w-]*)?)/.+(\.(?:jpe?g|webp|png|avif))$ /img/p/$2/$3/$1$4 last;
  rewrite ^/(([\d])([\d])([\d])(?:\-[\w-]*)?)/.+(\.(?:jpe?g|webp|png|avif))$ /img/p/$2/$3/$4/$1$5 last;
  rewrite ^/(([\d])([\d])([\d])([\d])(?:\-[\w-]*)?)/.+(\.(?:jpe?g|webp|png|avif))$ /img/p/$2/$3/$4/$5/$1$6 last;
  rewrite ^/(([\d])([\d])([\d])([\d])([\d])(?:\-[\w-]*)?)/.+(\.(?:jpe?g|webp|png|avif))$ /img/p/$2/$3/$4/$5/$6/$1$7 last;
  rewrite ^/c/([\d]+)(|_thumb)(\-[\.*\w-]*)/.+(\.(?:jpe?g|webp|png|avif))$ /img/c/$1$2$3$4 last;
  rewrite ^/c/([a-zA-Z_-]+)(|_thumb)(-[\d]+)?/.+(\.(?:jpe?g|webp|png|avif))$ /img/c/$1$2$3$4 last;

  location / {
    try_files $uri $uri/ /index.php?$args;
  }

  # Nothing that is not a public asset: VCS, env, lock/manifest files, the
  # cache and log trees, templates and other source that ships in the tree.
  location ~ /\.(?!well-known) { deny all; }
  location ~* ^/(composer\.(json|lock)|Makefile|INSTALL\.txt|LICENSES|docs/|\.apptest/) { deny all; }
  location ~* ^/(app|bin|cache|classes|config|controllers|docs|localization|log|override|pdf|src|tests|tools|translations|var|vendor)/ { deny all; }
  location ~* ^/(download|upload)/ { deny all; }
  location ~* \.(tpl|twig|yml|yaml|log|sql|dist|phar)$ { deny all; }
  location ~* ^/modules/.+\.(tpl|twig|yml|yaml|log|sql|md|txt|json|lock|xml|dist)$ { deny all; }
  location ~* ^/themes/.+\.(tpl|yml|md|txt|lock)$ { deny all; }

  # Symfony back office: /admin-apptest/index.php/<route>. The admin folder is
  # renamed per install, so it is pinned by the fixture (admin-apptest).
  location ^~ /admin-apptest/ {
    try_files $uri $uri/ /admin-apptest/index.php$is_args$args;
    location ~* \.(tpl|twig|yml|yaml)$ { deny all; }
    location ~ \.php(/|$) {
      include fastcgi_params;
      fastcgi_split_path_info ^(.+?\.php)(/.*)?$;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param PATH_INFO $fastcgi_path_info;
      fastcgi_param HTTP_AUTHORIZATION $http_authorization;
      fastcgi_pass php:9000;
    }
  }

  # Public Symfony front (api / assets); everything else with a .php is a
  # front controller PrestaShop ships.
  location ~ \.php(/|$) {
    include fastcgi_params;
    fastcgi_split_path_info ^(.+?\.php)(/.*)?$;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    try_files $fastcgi_script_name =404;
    fastcgi_pass php:9000;
  }

  location ~* \.(jpe?g|png|gif|webp|avif|svg|ico|css|js|woff2?|ttf|otf|eot)$ {
    expires 30d;
    access_log off;
    try_files $uri /index.php?$args;
  }
}
