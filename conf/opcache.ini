[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.max_wasted_percentage = 10
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1
opcache.enable_file_override = 0
opcache.huge_code_pages = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; PHP 7.x opcache always creates a lock file in lockfile_path (8.x does not),
; and its /tmp default kills php-fpm on a read-only rootfs with "Unable to
; create lock file". /dev/shm stays a writable tmpfs under docker --read-only
; and Kubernetes readOnlyRootFilesystem alike.
opcache.lockfile_path = /dev/shm
