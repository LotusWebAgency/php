[openssl]
; The system ca-certificates trust store, present on every flavor and PHP version.
; The vendored OpenSSL on 7.0-8.0 reaches it through the symlinks the Dockerfile
; puts in its compiled-in openssldir (/etc/ssl/openssl-1.1); setting it here makes it
; explicit in php.ini. System OpenSSL 4 resolves it on its own, so the line is a no-op there.
openssl.cafile = /etc/ssl/certs/ca-certificates.crt
