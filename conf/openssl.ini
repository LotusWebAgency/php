[openssl]
; Debian's ca-certificates trust store, present on every flavor and PHP version.
; The vendored OpenSSL on 7.0-8.0 already defaults to this path through
; deps/build-deps.sh's --openssldir=/etc/ssl; setting it here makes it explicit in
; php.ini. System OpenSSL 3 resolves it on its own, so the line is a no-op there.
openssl.cafile = /etc/ssl/certs/ca-certificates.crt
