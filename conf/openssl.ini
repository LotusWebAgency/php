[openssl]
; Debian's own ca-certificates-maintained trust store, present via the
; ca-certificates package on every flavor/era regardless of PHP version.
; Belt-and-suspenders alongside deps/build-deps.sh's --openssldir=/etc/ssl
; for the legacy era's vendored OpenSSL: that fixes the compiled-in default
; (openssl_get_cert_locations()), this makes the same path explicit and
; visible in php.ini rather than implicit in a build script, and keeps
; working even if the compiled-in default is ever wrong. The modern era's
; system OpenSSL 3 already resolves this correctly on its own -- this line
; is a harmless, equally-correct no-op there, not a legacy-only workaround.
openssl.cafile = /etc/ssl/certs/ca-certificates.crt
