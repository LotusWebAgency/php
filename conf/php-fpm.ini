[PHP]
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
ignore_repeated_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
allow_url_fopen = On
allow_url_include = Off

max_execution_time = 300
max_input_time = 120
max_input_vars = 10000
memory_limit = 256M
post_max_size = 128M
upload_max_filesize = 128M

realpath_cache_size = 4096K
realpath_cache_ttl = 600
zend.exception_ignore_args = On
; fatal_error_backtraces exists from PHP 8.5; older versions ignore the unknown directive.
fatal_error_backtraces = Off
; assert() is compiled out in production; the compiled default would execute it.
zend.assertions = -1

; proc_open is deliberately absent: composer, symfony/process and laravel
; queue workers all require it.
disable_functions = passthru, shell_exec, exec, system, show_source, dl, popen, pcntl_exec

[Session]
session.use_strict_mode = 1
session.upload_progress.enabled = 0
session.use_only_cookies = 1
session.auto_start = 0
session.gc_probability = 1
session.gc_divisor = 500
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.sid_length = 48
session.sid_bits_per_character = 6

[MySQLi]
; PHP 7.0 defaults to 1 and 8.x to 0; LOAD DATA LOCAL lets a hostile server read client files.
mysqli.allow_local_infile = 0
