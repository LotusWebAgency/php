[www]
user = www-data
group = www-data
listen = ${PHP_FPM_LISTEN}
listen.backlog = 4096

; pm and the four pool-size directives are ${VAR}-driven; php-fpm resolves them
; from its own process environment at startup. The Dockerfile bakes static ENV
; defaults, so a container that bypasses docker-php-entrypoint still gets a valid
; config. When the entrypoint runs, it autotunes pm.max_children, start_servers,
; min_spare_servers and max_spare_servers from the container's memory limit and
; exports the result.
;
; Two namespaces on purpose. The four autotuned directives read
; PHP_FPM_*_EFFECTIVE, which nobody is meant to set. Operators set
; PHP_FPM_MAX_CHILDREN and friends, which have no baked default and so are unset
; unless someone set them; that is the only way the entrypoint can tell "the
; operator asked for 16" from "nobody touched the default of 16". Everything below
; the autotuned four is plain passthrough: the variable operators set is the
; variable this file reads, and `-e` keeps working with the entrypoint bypassed.
pm = ${PHP_FPM_PM}
pm.max_children = ${PHP_FPM_MAX_CHILDREN_EFFECTIVE}
pm.start_servers = ${PHP_FPM_START_SERVERS_EFFECTIVE}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_EFFECTIVE}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_EFFECTIVE}
pm.max_requests = ${PHP_FPM_MAX_REQUESTS}
pm.status_path = ${PHP_FPM_STATUS_PATH}
ping.path = /fpm-ping
ping.response = pong

access.log = ${PHP_FPM_ACCESS_LOG}
access.format = "%R - %u %t \"%m %r%Q%q\" %s %{mili}d %{kilo}M %C%%"
slowlog = /proc/self/fd/2
request_slowlog_timeout = ${PHP_FPM_SLOWLOG_TIMEOUT}

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
process.dumpable = no
security.limit_extensions = .php

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
; Belt and suspenders with the conf.d mechanism (99-env.ini): disable_functions is
; locked here too, so this hardening does not depend on conf.d being scanned. It
; is the exception to "php_admin_value wins over a plain ini directive regardless
; of load order": disable_functions is unioned across every ini source php-fpm
; reads it from (main php.ini and a pool's php_admin_value/php_value alike), never
; replaced by the later one. A pool that names only its own extra function still
; keeps every name the main ini disabled, although ini_get("disable_functions")
; shows only the php_admin_value text.
;
; PHP_DISABLE_FUNCTIONS adds to the baked disable_functions list and never
; replaces it. When it is set and conf.d is writable, docker-php-entrypoint writes
; 99-env.ini's disable_functions as the union of 10-php.ini's baked list and the
; operator's, so this php_admin_value unioning again is idempotent. Under bare
; --read-only 99-env.ini is never written and the union is with 10-php.ini's baked
; default. Either way a baked function the operator does not mention (exec, if
; they only ask for proc_open) stays disabled.
php_admin_value[disable_functions] = ${PHP_DISABLE_FUNCTIONS}
