[www]
user = www-data
group = www-data
listen = ${PHP_FPM_LISTEN}
listen.backlog = 4096

; pm and the four pool-size directives are ${VAR}-driven (task 11, ruling
; T11-G) -- php-fpm resolves these from its own process environment at
; startup. The Dockerfile bakes a static ENV default matching what this
; file hardcoded before task 11 existed, so a container that bypasses
; docker-php-entrypoint entirely still gets a valid config; the entrypoint,
; when it runs, autotunes pm.max_children/start_servers/min_spare_servers/
; max_spare_servers from the container's actual memory limit and exports
; the result.
;
; Two namespaces on purpose (ruling T11-I). The four autotuned directives
; read PHP_FPM_*_EFFECTIVE, which nobody is meant to set: the operator sets
; PHP_FPM_MAX_CHILDREN and friends, which carry no baked default and are
; therefore unset unless somebody set them -- the only way the entrypoint
; can tell "the operator asked for 16" from "nobody touched the default of
; 16", which it could not, and got wrong, while both meanings shared one
; name. Everything below that line is plain passthrough: no code derives it,
; so the variable operators set is the variable this file reads, and `-e`
; keeps working even with the entrypoint bypassed.
pm = ${PHP_FPM_PM}
pm.max_children = ${PHP_FPM_MAX_CHILDREN_EFFECTIVE}
pm.start_servers = ${PHP_FPM_START_SERVERS_EFFECTIVE}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_EFFECTIVE}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_EFFECTIVE}
pm.max_requests = ${PHP_FPM_MAX_REQUESTS}
pm.status_path = ${PHP_FPM_STATUS_PATH}
ping.path = /fpm-ping
ping.response = pong

access.log = ${PHP_FPM_ACCESS_LOG}
access.format = "%R - %u %t \"%m %r%Q%q\" %s %{mili}d %{kilo}M %C%%"
slowlog = /proc/self/fd/2
request_slowlog_timeout = ${PHP_FPM_SLOWLOG_TIMEOUT}

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
process.dumpable = no
security.limit_extensions = .php

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
; Belt and suspenders with the conf.d ini mechanism (99-env.ini, task 11):
; disable_functions locked here too, so this hardening does not depend on
; PHP_INI_SCAN_DIR/conf.d being scanned correctly at all. This one directive
; is the exception to "php_admin_value always wins over a plain ini
; directive regardless of load order" -- disable_functions is UNIONED
; (cumulative) across every ini source php-fpm resolves it from, main php.ini
; and a pool's own php_admin_value/php_value alike, never replaced by the
; later one the way an ordinary scalar directive (error_log, above) is.
; Confirmed live against a running worker: a pool whose php_admin_value names
; only its own extra function still leaves every name the main ini already
; disabled in force too, and ini_get("disable_functions") shows only the
; php_admin_value text even though both are actually gone (T19-G/T19-O).
;
; Owner ruling (task 19b fix round 3): PHP_DISABLE_FUNCTIONS adds to the
; baked disable_functions list; it never replaces it. docker-php-entrypoint
; enforces this at the other end of this cumulative behaviour: whenever
; PHP_DISABLE_FUNCTIONS is set and conf.d is writable, 99-env.ini's own
; disable_functions directive is written as the UNION of 10-php.ini's baked
; list and the operator's requested one (never the requested list alone), so
; this php_admin_value unioning a second time on top of that is idempotent.
; Under bare --read-only (99-env.ini is never written, so 10-php.ini's baked
; default is still the ini-layer value this unions with), the same union
; falls out for free, exactly as it always did. Either way, a function in
; the baked default but never mentioned in PHP_DISABLE_FUNCTIONS (exec, say,
; if the operator only asks for proc_open) stays disabled.
php_admin_value[disable_functions] = ${PHP_DISABLE_FUNCTIONS}
