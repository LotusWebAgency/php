# sha256 pins for the php.net release tarball + its detached signature, one
# row per PHP_RELEASE in matrix.json (task 31). php.net publishes no
# .sha256/.sha512 sidecar for distributions/ (only the GPG signature this
# project already verifies via php/release-keys.asc), so these are computed
# locally against a tarball whose signature was verified good against that
# same keyring before its hash was ever recorded here -- same discipline as
# every other lock file in this repo, just derived from a signature instead
# of trusting an upstream-published digest.
#
# This is additive, not a replacement for the GPG check in the Dockerfile:
# it exists so deps/fetch-verified.sh has a hash to key the shared
# /var/cache/src cache on (every other fetch in this project already had
# one), and it isn't the only bit standing in front of a tampered tarball
# reaching this build -- gpg --verify still runs, and still fails the build
# on its own if it ever disagrees with a hash below.
#
# release     sha256 (php-<release>.tar.xz)                                     sha256 (.tar.xz.asc)
