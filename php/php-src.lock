# sha256 pins for the php.net release tarball and its detached signature, one
# row per PHP_RELEASE in matrix.json. php.net publishes no .sha256/.sha512
# sidecar for distributions/ (only the GPG signature verified via
# php/release-keys.asc), so these are computed locally against a tarball whose
# signature verified good against that same keyring before its hash was
# recorded.
#
# This is additive to the GPG check in the Dockerfile: it gives
# deps/fetch-verified.sh a hash to key the shared /var/cache/src cache on, and
# gpg --verify still runs and fails the build on its own if it ever disagrees
# with a hash below.
#
