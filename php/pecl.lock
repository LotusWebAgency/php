# name        version   sha256                                                            php-min  php-max
#
# php-min / php-max are the range the package itself declares in its
# package.xml, transcribed, with "-" for "not declared" and for the
# source=github rows that have no package.xml at all.
#
# They are here because a floor set *too high* is invisible to every check this
# project has: tests/smoke.sh derives the expected extension set from the
# same php/ext.json constraints that drive the build, so raising a floor shrinks
# the expectation in lockstep and the check still prints ok. That is exactly how
# PHP 7.0-7.4 silently lost xdebug -- five images shipped with no debugger and
# nothing failed. scripts/test_ext_registry.py now cross-checks every matrix
# version against these columns, so a lock bump that outruns its ext.json range
# fails the test suite instead of quietly deleting an extension.
# igbinary is on a release candidate on purpose: 3.2.17RC1 is the only release
# that supports PHP 8.5 (its notes: "Support PHP 8.5"; 3.2.16 predates it).
# Move to 3.2.17 stable once PECL publishes it.
