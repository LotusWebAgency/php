# Pinned sources for the PGO training corpus (task 16). Same discipline as
# deps/versions.lock: nothing is fetched without a version and a sha256.
#
# Keyed by corpus tier, not by era. A tier is a floor PHP version listed in
# corpus/tiers; scripts/pgo_tiers.py derives which matrix.json versions it
# serves. Every row names exactly one tier -- there is no "both"/"all"
# wildcard, so a lookup can never be shadowed by a broader row sitting above
# the one that was meant, and WordPress 7.0.4 appearing twice below is two
# independent pins rather than one row two tiers share by accident.
#
# The versions are set by what each tier's floor PHP supports, measured:
#   WordPress 7.0.4 needs php 7.4   ($required_php_version, checked at boot)
#   WordPress 6.9.7 needs php 7.2.24
#   WordPress 6.5.5 needs php 7.0.0
#   sqlite-database-integration 3.0.0 needs php 7.2, 2.2.23 php 7.2, 2.1.13 php 7.0
#
# The drop-in is pinned to the line that shipped alongside its tier's
# WordPress, not simply to the newest that satisfies the PHP floor. 3.0.0
# rewrote the driver for WordPress 7.0 and its SHOW TABLES translation makes
# WordPress 6.9.7 stop at "One or more database tables are unavailable"
# during install -- measured, on the 7.2 tier, before this row was changed.
#   laravel/laravel v12 needs ^8.2, v10 ^8.1, v6 ^7.2.5, v5.8 ^7.1.3, v5.5 >=7.0.0
#
# The brief for this task fetched https://wordpress.org/latest.tar.gz and the
# plugin repo's unversioned .zip. Both are moving targets, which defeats the
# only property task 17 needs from this corpus: two profiles taken from two
# builds have to differ by what the compiler did, not by what WordPress
# shipped that morning.
#
# PrestaShop is pinned differently from the three rows above (task 29a). Its
# release zips are only published on Docker Hub's *build inputs* -- GitHub
# release assets (objects.githubusercontent.com) and download.prestashop.com
# are both unreachable from this build's network (confirmed: github.com,
# api.github.com, codeload.github.com and download.prestashop.com all time
# out at the TCP level; only raw.githubusercontent.com, packagist.org and
# Docker Hub answer). PrestaShop's own official Docker Hub image
# (prestashop/prestashop) is a legitimate alternative distribution channel --
# it is the vendor's own published artifact, not a third-party mirror -- so
# each row below pins that image by its immutable manifest digest (the
# "sha256" column) instead of a fetched zip's checksum. The "url" column keeps
# the human-readable tag (which the digest was resolved from) for reference;
# Dockerfile.corpus's FROM lines use the digest, never the tag, so a tag being
# repointed upstream cannot silently change what gets built. "version" is the
# PrestaShop release actually installed inside that image (PS_VERSION from
# `docker inspect`, confirmed against the extracted app's own files), which is
# independent of the docker tag's own naming.
#
# Release choice per tier -- newest PrestaShop whose declared PHP range covers
# every matrix.json version the tier serves (php/pgo/corpus/tiers), checked
# against PrestaShop's own sanity.yml CI matrix per tag and, more precisely,
# against which prestashop/prestashop:<version>-<php> tags Docker Hub actually
# publishes (that tag matrix is maintained by PrestaShop itself and is more
# current than the autoupdater's channel.xml, which as of this task still
# advertises 8.2.1 as latest and does not list 9.x at all even though 9.0.0,
# 9.0.1, 9.1.0, 9.1.5 and 9.2.0 all exist as real tags and images):
#   8.2 tier (php 8.2-8.5): PrestaShop 9.2.0 publishes prestashop/prestashop
#     tags -8.1,-8.2,-8.3,-8.4,-8.5 -- covers the entire tier. No tier-floor
#     compromise needed here, unlike the brief's own worry that 8.2 might need
#     an unreleased 8.5-supporting version.
#   8.1 tier (php 8.1 only): same PrestaShop 9.2.0 (its composer.json floor is
#     >=8.1, config.platform.php 8.1.0) -- the newest release that still
#     supports 8.1, same as WordPress reusing one version across the 8.1/8.2
#     tiers in this file.
#   7.2 tier (php 7.2-8.0): PrestaShop 8.2.8 (the newest 8.2.x patch) publishes
#     -7.2,-7.3,-7.4,-8.0,-8.1 -- covers the entire tier (with room to spare:
#     8.2.8 also runs on 8.1, but the 8.1 tier already has its own, newer
#     release). PrestaShop 9.x dropped PHP 7 support entirely (floor 8.1), so
#     8.2.8 is the newest release usable here.
#   7.1 tier (php 7.1 only): PrestaShop 1.7.8.11 (the last 1.7.8.x patch)
#     publishes -7.1,-7.2,-7.3,-7.4. Confirmed via
#     raw.githubusercontent.com/PrestaShop/PrestaShop/1.7.8.11/composer.json
#     (config.platform.php 7.1.3) and the tag's own sanity.yml CI matrix.
#   7.0 tier (php 7.0 only): NO PrestaShop 1.7.x release ever supported PHP
#     7.0 -- 1.7.6.9 (composer platform 5.6.0) publishes Docker Hub tags
#     -5.6,-7.1,-7.2 only, no -7.0. The only PrestaShop that runs on PHP 7.0 is
#     the 1.6 branch (pre-Symfony-admin, a materially different codebase from
#     the 1.7-9.x line this repo otherwise trains): Docker Hub carries it only
#     as the floating tag `1.6-7.0[-fpm]` (last pushed 2020-11-19), not as a
#     version-pinned tag -- `1.6.1.24-7.0` does not exist. Pinned here by that
#     floating tag's current manifest digest (immutable regardless of the tag
#     moving again), with PS_VERSION=1.6.1.24 confirmed via `docker inspect`.
#     See task-29a-report.md for why this is flagged as a coverage gap rather
#     than silently trained on: it is a real, working PrestaShop, but not
#     reproducibly re-resolvable the way every other row in this file is.
#
# tier  name          version        sha256 (image digest)                                            url (docker tag, for reference -- not what is fetched)
8.2     prestashop    9.2.0          bad534d47aa2365b3ec2ea136736a530592b8e62582607fb4129d3e8127e8756  docker://prestashop/prestashop:9.2.0-8.2
8.1     prestashop    9.2.0          a862e53476bb32816780101cc333f8997045e5b0dd809c5df6e5b4d32ed7dd73  docker://prestashop/prestashop:9.2.0-8.1
7.2     prestashop    8.2.8          0c666c1dcd821d2484df553bc2250acabf5d905097ae271dbc0e1363b30d2c66  docker://prestashop/prestashop:8.2.8-7.2-fpm
7.1     prestashop    1.7.8.11       25a4fa68ab0529a5886f45ea9aad04d2626f7c1b861c62cbe643d2574a8e6473  docker://prestashop/prestashop:1.7.8.11-7.1-fpm
7.0     prestashop    1.6.1.24       fd757ab1a4847abc053f19dfbf0f4885ffbf4fc06b02bce04035f30c952e234f  docker://prestashop/prestashop:1.6-7.0-fpm
#
# prestashop-lang (task 29b): the CLI install's own English language step is
# not the network-independent thing it looks like. install/classes/../
# PrestaShopBundle/Install/Install.php::installLanguages() unconditionally
# calls Language::downloadXLFLanguagePack(), which hits
# i18n.prestashop-project.org over HTTPS with NO existing-cache check of its
# own, every single install, English included -- there is no offline path
# through this code. Confirmed by running the installer under
# `RUN --network=none` (the previous ruling in this file/Dockerfile.corpus):
# it fails in ~2s with "Cannot download language pack \"en\"" instead of
# hanging, exactly as designed, which is what surfaced this rather than
# leaving it to hang.
#
# Fixed the way this file fixes everything else the build needs: fetch the
# one file that call would have fetched (the vendor's own per-version en-US
# translation pack, same host as the runtime call, so this is not a
# different artifact than what "worked online" would have used) here, ahead
# of the network=none step. Placed at
# _PS_TRANSLATIONS_DIR_/sf-en-US.zip so Language::installSfLanguagePack()'s
# own cache check (translationPackIsInCache()) is satisfied with real content
# -- Dockerfile.corpus also touches an empty _PS_TRANSLATIONS_DIR_/en.gzip,
# which is the actual gate in front of the download call: dead code from an
# older pack format that is only ever existence-checked, never read or
# written by the current downloader, so an empty file legitimately satisfies
# it (confirmed: no other reference to "*.gzip" anywhere in classes/Language.php).
#
# No 7.0 row: PrestaShop 1.6.1.24 predates the Symfony admin and this whole
# translation-pack system (confirmed: 1.6's image has no
# install/langs/en/language.xml at the path the 1.7+ installer reads), so its
# installer never makes this call in the first place -- nothing to prefetch.
#
# These rows are `latest`, the only unpinned rows in this file (owner ruling
# 2026-10-01). Upstream re-exports every pack in place whenever it cuts a
# release -- the URL is per version, the bytes follow its current catalogue:
# 9.1.5's pack turned byte-identical to 9.2.0's the day 9.2.0 shipped, 8.2.8
# changed zip metadata only -- and a sha256 pin broke every corpus build here
# twice in two days (2026-09-29, 2026-09-30). The pack is installer data, not
# code, so fetch.sh holds it to its shape instead of a hash (a zip under
# 16 MiB of en-US/*.xlf and nothing else), logs the sha256 it got, and never
# caches it. BuildKit's layer cache still means "latest as of the last cold
# build of that layer".
#
# tier  name              version     sha256   url
8.2     prestashop-lang   9.2.0       latest   https://i18n.prestashop-project.org/translations/9.2.0/en-US/en-US.zip
8.1     prestashop-lang   9.2.0       latest   https://i18n.prestashop-project.org/translations/9.2.0/en-US/en-US.zip
7.2     prestashop-lang   8.2.8       latest   https://i18n.prestashop-project.org/translations/8.2.8/en-US/en-US.zip
7.1     prestashop-lang   1.7.8.11    latest   https://i18n.prestashop-project.org/translations/1.7.8.11/en-US/en-US.zip
#
# Framework code is not here -- Laravel's app skeleton is (the tarball only
# carries app files, no dependencies), but every Composer package it and the
# Symfony app pull in is pinned by the committed composer.lock files under
# corpus/<app>/<tier>/.
#
# Every sha256 below was computed locally against the fetched artifact:
# neither wordpress.org nor GitHub publishes a checksum to verify against.
# (wordpress.org answers 200 with the tarball body for *any* path under the
# release directory, including a .sha256 that does not exist -- do not treat a
# successful fetch there as proof the file was found.)
#
# GitHub's archive/refs/tags/ tarballs are generated on demand and their gzip
# framing has changed at least once upstream (2023), which invalidates a
# sha256 pin without the tag moving. deps/versions.lock already accepts that
# risk for ImageMagick; if a laravel-app row starts failing verification with
# an unchanged version, check that before assuming compromise.
