7.1     prestashop    1.7.8.11       25a4fa68ab0529a5886f45ea9aad04d2626f7c1b861c62cbe643d2574a8e6473  docker://prestashop/prestashop:1.7.8.11-7.1-fpm
7.0     prestashop    1.6.1.24       fd757ab1a4847abc053f19dfbf0f4885ffbf4fc06b02bce04035f30c952e234f  docker://prestashop/prestashop:1.6-7.0-fpm
#
# prestashop-lang: the CLI install's English language step is not
# network-independent. PrestaShopBundle/Install/Install.php::installLanguages()
# unconditionally calls Language::downloadXLFLanguagePack(), which hits
# i18n.prestashop-project.org over HTTPS with no existing-cache check, English
# included. Under `RUN --network=none` the installer fails in about 2s with
# "Cannot download language pack \"en\"" instead of hanging.
#
# So the one file that call would fetch (the vendor's per-version en-US
# translation pack, same host as the runtime call) is fetched ahead of the
# network=none step and placed at _PS_TRANSLATIONS_DIR_/sf-en-US.zip, which
# satisfies Language::installSfLanguagePack()'s cache check
# (translationPackIsInCache()) with real content. Dockerfile.corpus also touches an
# empty _PS_TRANSLATIONS_DIR_/en.gzip, the actual gate in front of the download
# call: dead code from an older pack format that is only existence-checked, never
# read or written (no other reference to "*.gzip" in classes/Language.php).
#
# No 7.0 row: PrestaShop 1.6.1.24 predates the Symfony admin and this
# translation-pack system (its image has no install/langs/en/language.xml at the
# path the 1.7+ installer reads), so its installer never makes the call.
#
# These rows are `latest`, the only unpinned rows in this file. Upstream
# re-exports every pack in place whenever it cuts a release (the URL is per
# version, the bytes follow its current catalog: 9.1.5's pack became
# byte-identical to 9.2.0's the day 9.2.0 shipped, 8.2.8 changed zip metadata
# only), and a sha256 pin broke corpus builds repeatedly. The pack is installer
# data, not code, so fetch.sh holds it to its shape (a zip under 16 MiB of
# en-US/*.xlf and nothing else), logs the sha256 it got, and never caches it.
# BuildKit's layer cache still means "latest as of the last cold build of that
# layer".
#
# tier  name              version     sha256   url
8.5     prestashop-lang   9.2.0       latest   https://i18n.prestashop-project.org/translations/9.2.0/en-US/en-US.zip
8.4     prestashop-lang   8.2.8       latest   https://i18n.prestashop-project.org/translations/8.2.8/en-US/en-US.zip
8.2     prestashop-lang   8.2.8       latest   https://i18n.prestashop-project.org/translations/8.2.8/en-US/en-US.zip
8.1     prestashop-lang   8.2.8       latest   https://i18n.prestashop-project.org/translations/8.2.8/en-US/en-US.zip
7.2     prestashop-lang   8.2.8       latest   https://i18n.prestashop-project.org/translations/8.2.8/en-US/en-US.zip
7.1     prestashop-lang   1.7.8.11    latest   https://i18n.prestashop-project.org/translations/1.7.8.11/en-US/en-US.zip
#
# Framework code is not here, except Laravel's app skeleton (the tarball carries
# app files only). Every Composer package it and the Symfony app pull in is pinned
# by the committed composer.lock files under corpus/<app>/<tier>/. Drupal (the 8.4
# and 8.5 tiers only, see corpus/tiers) is pinned that way entirely --
# drupal/core-recommended 11.4.8 and drush 13 from Packagist, the scaffold plugin
# writing web/ -- so it has no row here, and neither does a tier that does not
# train it.
#
# Every sha256 below was computed locally against the fetched artifact; neither
# wordpress.org nor GitHub publishes a checksum. (wordpress.org answers 200 with
# the tarball body for any path under the release directory, including a .sha256
# that does not exist -- a successful fetch there proves nothing.)
#
# GitHub's archive/refs/tags/ tarballs are generated on demand and their gzip
# framing has changed at least once upstream (2023), which invalidates a sha256 pin
# without the tag moving. deps/versions.lock accepts the same risk for ImageMagick;
# if a laravel-app row fails verification with an unchanged version, check that
# before assuming compromise.
#
# tier  name          version   sha256                                                            url
