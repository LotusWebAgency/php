# Pinned sources for the PGO training corpus. Same discipline as
# deps/versions.lock: nothing is fetched without a version and a sha256.
#
# Keyed by corpus tier. A tier is a floor PHP version listed in corpus/tiers;
# scripts/pgo_tiers.py derives which matrix.json versions it serves. Every row
# names exactly one tier (no wildcard), so a broader row cannot shadow the one
# that was meant, and a version appearing under two tiers is two independent pins.
#
# Versions follow what each tier's floor PHP supports:
#   WordPress 7.0 needs php 7.4     ($required_php_version, checked at boot)
#   WordPress 6.9 needs php 7.2.24
#   WordPress 6.5 needs php 7.0.0
#   sqlite-database-integration 3.0 needs php 7.2, 2.2 php 7.2, 2.1 php 7.0
#   laravel/laravel v12 needs ^8.2, v10 ^8.1, v6 ^7.2.5, v5.8 ^7.1.3, v5.5 >=7.0.0
#
# The drop-in is pinned to the line that shipped alongside its tier's WordPress,
# not to the newest that satisfies the PHP floor: 3.0 rewrote the driver for
# WordPress 7.0, and its SHOW TABLES translation makes WordPress 6.9 stop at "One
# or more database tables are unavailable" during install.
#
# Every version is pinned because two profiles from two builds must differ by what
# the compiler did, not by what wordpress.org or the plugin repo shipped that
# morning.
#
# PrestaShop is pinned differently. GitHub release assets and
# download.prestashop.com are unreachable from the build network (github.com,
# api.github.com, codeload.github.com and download.prestashop.com time out; only
# raw.githubusercontent.com, packagist.org and Docker Hub answer). The vendor's own
# prestashop/prestashop image is an official distribution channel, so each row
# pins that image by its immutable manifest digest (the "sha256" column).
# Dockerfile.corpus's FROM lines use the digest, never the tag, so a repointed tag
# cannot change what gets built; the "url" column keeps the tag the digest was
# resolved from, for reference. "version" is the PrestaShop release installed
# inside the image (PS_VERSION from `docker inspect`), which is independent of the
# docker tag's naming.
#
# Release per tier, the newest PrestaShop that fits:
#   8.5 tier (php 8.5 only): PrestaShop 9.2.0, the newest line (floor php 8.1,
#     composer config.platform.php 8.1.0); Docker Hub publishes tags -8.1 to -8.5.
#   8.4 tier (php 8.4 only), 8.2 tier (php 8.2-8.3), 8.1 tier (php 8.1) and
#   7.2 tier (php 7.2-8.0): PrestaShop 8.2.8, the newest 8.2.x patch. The devdocs
#     and the installer's message say 8.2 supports php up to 8.1, and Docker Hub
#     publishes prestashop/prestashop:8.2.8-* only up to -8.1, but PS 8.2 has run
#     on PHP 8.4 in production for a long time, so it trains all four tiers.
#     (The installer's numeric cap, install/install_version.php's
#     _PS_INSTALL_MAXIMUM_PHP_VERSION_ID_, is 81099 -- php 8.10.99, a typo for
#     80199 -- so index_cli.php enforces nothing below php 8.10 and the CLI install
#     runs on 8.4 as shipped.) The release tree is php-independent (vendor/ is
#     bundled), so all four tiers pin the one digest below, the -7.2-fpm image,
#     instead of a per-php image of the same release that could differ in a byte.
#     PrestaShop 9.x dropped PHP 7 (floor 8.1), so 8.2.8 is also the newest
#     release usable on 7.2-8.0.
#   7.1 tier (php 7.1 only): PrestaShop 1.7.8.11, the last 1.7.8.x patch, which
#     publishes -7.1 to -7.4. Confirmed via
#     raw.githubusercontent.com/PrestaShop/PrestaShop/1.7.8.11/composer.json
#     (config.platform.php 7.1.3) and the tag's own sanity.yml CI matrix.
#   7.0 tier (php 7.0 only): no PrestaShop 1.7.x release ever supported PHP 7.0
#     (1.7.6.9, composer platform 5.6.0, publishes -5.6, -7.1, -7.2 only). The only
#     PrestaShop that runs on PHP 7.0 is the 1.6 branch -- pre-Symfony-admin, a
#     materially different codebase from the 1.7-9.x line trained elsewhere.
#     Docker Hub carries it only as the floating tag `1.6-7.0[-fpm]` (last pushed
#     2020-11-19); `1.6.1.24-7.0` does not exist. It is pinned by that tag's
#     current manifest digest, with PS_VERSION=1.6.1.24 confirmed via
#     `docker inspect`. This is a coverage gap: a real, working PrestaShop, but
#     not re-resolvable from a version tag like every other row here.
#
# tier  name          version        sha256 (image digest)                                            url (docker tag, for reference -- not what is fetched)
