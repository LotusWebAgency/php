# Libraries php-src can build from a *bundled* copy instead of the system one,
# and which copy each shipped image is required to link.
#
# Why this file exists: configure defaults to the bundled copy when no flag says
# otherwise, and nothing else asserts which one came out the other end (PHP 7.0
# shipped SQLite 3.14.2 from a bundled libsqlite; bundled zstd and libxml2 have
# the same shape). tests/smoke.sh reads this file and interrogates the built
# binary's ELF dynamic section, so the answer comes from the artifact, not from
# the flags we believe we passed.
#
# This list is literal, not derived, and that is deliberate: "php-src can bundle
# this" is a property of php-src, not of anything in this repo. php/ext.json's
# `libs` column is the closest thing, but deriving from it would be wrong in
# both directions -- it names dev packages for libraries that are legitimately
# *not* dynamically linked (the vendored OpenSSL must leave no NEEDED entry at
# all) and for libraries that end up in shared extension .so files rather than
# in the php binary. A curated list of three, with the reason for each, beats a
# derivation that would have to be special-cased until it was a list again.
#
# expect:
#   system   the php binary must carry a direct NEEDED entry for it
#   bundled  it must not -- the copy is compiled in. When a bundled row's
#            library moves to the system copy, this check fails and the row has
#            to be flipped, which is the point.
#
# lib          expect   owner    why
libsqlite3     system   -        php bundles ext/sqlite3/libsqlite through 7.3; 7.4 removed it, so 7.4+ need no flag. ext.json pins --with-sqlite3=/usr and --with-pdo-sqlite=/usr for 7.0-7.3.
libzip         system   -        php bundles ext/zip/lib through 7.2; ext.json pins --with-libzip=/usr for 7.0-7.2. 7.3 dropped the bundle and needs no flag.
libzstd        system   -        the pecl zstd tarball carries a whole copy of zstd in ext/zstd/zstd/lib and --enable-zstd alone compiles it in. php/ext.json also passes --with-libzstd, which routes ext/zstd through pkg-config to debian's libzstd instead. Two reasons beyond CVE reach: the bundled path does PHP_ADD_INCLUDE(ext/zstd/zstd/lib/common), which puts pool.h, debug.h, mem.h and a dozen other generic names on *every* extension's include path; and an untracked zstd compiled into the binary is a library the SBOM would not list.
