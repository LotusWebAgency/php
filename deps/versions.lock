# Vendored dependency pins for the legacy (PHP 7.0-8.0) builds.
#
# libxml2 and libxslt are vendored from Debian trixie's source packages. Wolfi ships
# libxml2 2.15 (.so.16), whose API php-src below 8.1.27 does not compile against,
# and libxslt 1.1.45 links it. Trixie's libxml2 is the 2.9.14 series (the
# `+really2.9.14` package) with the security fixes upstream's 2.9.14 lacks, applied as
# the Debian patch series; LIBXML_DOTTED_VERSION still reports 2.9.14. Each
# library is two rows: Debian's orig tarball, then its debian.tar.xz, whose
# debian/patches/series deps/build-deps.sh applies. A `-debian` row is a side
# input of the row above it and is never built on its own. The debian.tar.xz rows
# point at snapshot.debian.org: the pool drops superseded package versions, the
# snapshot does not. The orig tarballs stay on the pool, where they persist.
# libxslt is built against the libxml2 above it, so the order of these rows
# matters.
# era     name         version   applies-to   sha256                                                             url
legacy    libxml2         2.9.14                                  7.0-8.0      4fe913dec8b1ab89d13b489b419a8203176ea39e931eaa0d25b17eafb9c279e9   https://deb.debian.org/debian/pool/main/libx/libxml2/libxml2_2.12.7+dfsg+really2.9.14.orig.tar.xz
