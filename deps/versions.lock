# Vendored dependency pins for the legacy (PHP 7.0-8.0) era.
# Confirmed against PHP 7.0.33 by spike/FINDINGS.md unless noted there.
#
# libxml2 is deliberately NOT here (task 14 review, I2). Trixie's own
# libxml2 package is 2.12.7+dfsg+really2.9.14-2.1+deb13u3 -- Debian reverted
# to the 2.9.14 series for the same reason this project did (2.12+ broke
# consumers), but ships it with three security backports upstream's bare
# 2.9.14 tarball never received. Vendoring the unpatched upstream source to
# get a version Debian already provides, patched, was a real attack-surface
# regression with no benefit. deps-legacy installs libxml2-dev from apt
# instead; LIBXML_DOTTED_VERSION still reports 2.9.14, now from Debian's
# maintained copy.
