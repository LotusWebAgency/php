# Build -> test -> scan -> publish for lotuswebagency/php: a docker-bake matrix of
# 78 targets (11 PHP versions x 6 flavors, plus an x86-64-v3 / armv9-a variant
# of every flavor on 8.4 and 8.5), each built with a PGO training corpus
# that is itself a build input.
#
# Three modes, chosen by the event and the ref:
#
#   pull request (to main or develop)  `images` builds, tests and Trivy-gates a
#     small subset on amd64 without publishing. The aggregate `pr-gate` is the one
#     required check, so a PHP version bump that renames per-entry check names
#     cannot silently stop branch protection from covering anything.
#   push or dispatch on develop  `images` over the whole matrix, natively on amd64
#     and arm64 (no QEMU): every image is pushed by digest to GHCR
#     (ghcr.io/lotuswebagency/php/dev, with SBOM and max-mode provenance), pulled
#     back and tested by that digest: smoke, the ext-builder end-to-end test, the
#     slim parity check, Trivy. Every image that passed is tagged
#     dev:<tag>-<sha12>-<arch> for further testing; `dev-manifest` joins the
#     arches into dev:<tag>-<sha12> and, when every entry succeeded, moves the
#     floating dev:<tag>; `candidate` records the run's digests as
#     release-candidate.json. These are unsigned test builds, pruned by
#     dev-prune.yml. Nothing reaches Docker Hub: no job here logs in to it or
#     holds the `release` environment. The PGO corpus is built and published to
#     GHCR, and `fixtures` builds the application fixtures `extended` needs there.
#     Develop and main write, and every build reads, a registry build cache (the
#     deps-cache target in docker-bake.hcl).
#     A develop push or dispatch whose inputs hash (scripts/inputs-hash.sh) equals
#     that of the newest green develop run's release candidate, with every image
#     at most five days old, builds nothing (ci/reuse_plan.py, run by `plan`):
#     `images` pulls that run's images by digest, tests them again with today's
#     Trivy DB, tags them for this commit and records them in this run's
#     candidate with their original build run and time. The dispatch input
#     `rebuild` forces a build.
#   pull request from develop to main (the promote PR)  the `promote-check` job
#     applies the checks a copy release makes (below) to the PR head and decides
#     `copy` or not. When main could publish develop's images by copy, `images` is
#     skipped (nothing is built, and the merge ref's tree is the head's, so what the
#     PR gate passes is exactly what the push to main will copy). When it could not
#     (develop's run is stale or reused images, the first promotion after a change to
#     extended.yml's run-name, no extended run yet), `images` runs the subset build
#     like any other pull request and main rebuilds on the merge. promote-check
#     fails, and so blocks the PR, only for a set RELEASE_HOLD (the copy path and this
#     check only: a hold does not stop a push to main from building and publishing),
#     a merge ref that is not a merge of the PR head, or a merge ref whose tree is
#     not the head's.
#   push on main, when a merge commit of develop carries develop's tree unchanged
#     (ci/release_source.py, run by `release-source`; the checks are in its
#     header: the develop run of the second parent succeeded as a whole and built
#     every image itself and no later develop run of the commit exists, the
#     extended.yml run that completion started (event workflow_run, titled with
#     that commit and that run attempt) succeeded having pulled the images by the
#     digests of the run's release candidate, and that candidate is complete, for this inputs hash and this
#     ci.yml, at most seven days old, re-checked in every `merge` leg)  copies
#     instead of building: `images`, `corpus`, `corpus-merge` and `sources` are skipped,
#     and each `merge` leg takes the develop run's digests and test results by
#     run id, checks them against the candidate, copies the two per-arch indexes
#     from php/dev to the staging repository by digest (regctl; same digests, same
#     SBOM and provenance, which name develop's run), rescans both platform
#     manifests with today's Trivy DB (vulnerability, KEV, package floor), and goes
#     on as below: list, signatures, attestations, tags. The test-result
#     predicates keep develop's commit and run (git_sha, git_ref,
#     workflow_run_url); the list, its signatures and its attestations are main's.
#     The image's own revision label is develop's commit, the merge commit's
#     second parent, whose tree is the merge commit's.
#   push or dispatch on main with any other history, a dispatch, and the weekly cron
#     (default branch only) always build: `images` pushes every image by digest, with SBOM + max-mode provenance, to the
#     GHCR staging repository ghcr.io/lotuswebagency/php/release and tests that
#     digest. `merge` assembles the multi-arch lists, signs every manifest keylessly
#     with cosign and attaches keyless attestations: the test results `images` recorded
#     after smoke and Trivy passed, and the OpenVEX statements from
#     vex/php.openvex.json where one applies to the flavor. `promote` copies each
#     signed list to Docker Hub with its signatures and attestations, same
#     digests, and tags it there only after that. `hub-verify` checks one promoted
#     list anonymously, the way SECURITY.md tells users to; `sync-description`
#     updates the Docker Hub page. `promote` and `sync-description` are the only
#     jobs that reference the Docker Hub secrets and the only ones in the
#     `release` environment. The secrets are meant to be environment secrets of
#     `release`, with that environment limited to `main`: a repository setting
#     this file cannot enforce.
#
# One `images` entry is one PHP version for one microarchitecture and architecture
# (scripts/gen_matrix.py's version entries) and builds every flavor of it in one
# bake invocation, so the stages the flavors share are built once. Each image is
# still tested, pushed by its own digest, merged and signed separately. The slim
# flavors are also checked against their host's image (tests/test-slim-parity.sh:
# the same php, php-fpm, extension binaries and /usr/local tree).
#
# Every third-party action is pinned to a full commit SHA with a version comment;
# mutable tags have been hijacked before (GHSA-69fq-xp46-6x23). regctl, the one
# tool fetched outside an action, is pinned by version and sha256 in
# ci/install-regctl.sh, and the BuildKit image by digest (env below).
#
# PGO corpus: each of the 7 tiers (scripts/pgo_tiers.py) is architecture-specific
# (php/pgo/Dockerfile.corpus installs mariadb and inherits the whole cli-builder
# toolchain), so `corpus` builds each {tier, arch} natively and `corpus-merge`
# assembles the two per-arch images into one multi-platform index per tier. It is
# published as the floating `php<tier>` ref that every target's `corpus` context
# names and as `php<tier>-<inputs-hash>`. A `docker-image://` context resolves a
# multi-platform index to the building target's own platform, so one ref serves
# both the amd64 and the arm64 entries. Every images entry mounts the hash-pinned
# ref and asserts the pulled image's inputs-hash label: the floating tag can point
# at a corpus another tree trained (after a revert, for instance).
#
# Docker Hub access: authenticated reads drained the publishing account's pull
# limit and cost legs to 429s, so:
#   - Only `promote` and `sync-description` use Docker Hub credentials, and
#     `promote` only writes and HEADs (Docker Hub does not count a HEAD as a
#     pull) in a DOCKER_CONFIG made for that one step, after every read of the
#     run is done.
#   - Our own images are staged, tested, signed, attested and verified on GHCR
#     (ghcr.io/lotuswebagency/php/release) and never read back from Docker Hub.
#   - Third-party images are read anonymously, digest-pinned, and preferably not
#     from Docker Hub: BuildKit resolves docker.io through mirror.gcr.io, then
#     public.ecr.aws/docker (Docker's official images), then Docker Hub itself
#     (buildkitd-config-inline below); jobs that pull through the runner's own
#     daemon get mirror.gcr.io as its registry mirror (ci/hub-mirror.sh), and
#     so does the BuildKit image: every job that starts a docker-container
#     builder runs hub-mirror.sh first and retries the pinned BuildKit pull
#     before setup bootstraps it. Manifest-only work uses imagetools directly,
#     without starting a builder. The Dockerfile frontend named in
#     each `# syntax=` line is pinned by its multi-arch index digest as well
#     (Renovate's dockerfile manager keeps it current). A pinned digest means no
#     source can change what is pulled.
#   - The run's only Docker Hub reads are hub-verify's few anonymous ones.
#   - The base image is not on Docker Hub: cgr.dev/chainguard/wolfi-base, pinned
#     by digest in matrix.json and the Dockerfiles. `plan` verifies that
#     digest's Chainguard cosign signature before any job builds on it.
# Registry calls that can still meet a 429/5xx run under ci/retry.sh; builds also
# retry transient HTTP and apk failures, never deterministic build errors.
# Trivy's vulnerability DB is refreshed once per run in parallel with plan,
# then shared as an artifact so matrix scans use the same DB without updating it.
# The CISA KEV catalog is fetched in the same job and shared the same way.
name: ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build the images even when the last develop build has the same inputs. On develop it re-points the commit's dev tags, so the release of that commit rebuilds instead of copying (an older extended run no longer vouches for them)
        type: boolean
        default: false
  schedule:
    # Weekly rebuild: fresh base layers and Wolfi package updates.
    - cron: "10 19 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR and develop runs are canceled (the org's runners are scarce
  # and a develop push only produces GHCR test images, never a release); a main
  # run, which publishes, is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}

# Deny-by-default; every job below grants back only what its own steps need
# (id-token: write only for the cosign job, packages: write only for the jobs
# that push to GHCR).
permissions: {}

env:
  GHCR_CORPUS_REGISTRY: ghcr.io/lotuswebagency/php
  # develop's images: pushed by digest, tagged per commit and architecture, and
  # the repository a release candidate names.
  DEV_REPO: ghcr.io/lotuswebagency/php/dev
  # main's images between build and promotion: pushed by digest, tested, merged,
  # signed and attested here; promote copies them to Docker Hub. Its tags follow
  # the Docker Hub ones from the merge job on (see merge).
  STAGE_IMAGE: ghcr.io/lotuswebagency/php/release
  # The image of every docker-container BuildKit builder (setup-buildx-action's
  # default is moby/buildkit:buildx-stable-1 from Docker Hub, unpinned); also read
  # by tests/test-attest.sh.
  BUILDKIT_IMAGE: docker.io/moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
  # The Trivy release the prepare steps install; the scan steps skip the
  # action's own setup and run it.
  SETUP_TRIVY_VERSION: v0.76.2
  # The Cosign release cosign-installer fetches (its own default is older).
  COSIGN_VERSION: v3.1.5
  # Control for the Trivy scans: an image's report must list more than this many
  # OS packages (the "Trivy package floor" steps), so a scan that read no package
  # database (an empty report passes every gate above it) cannot go green. A
  # floor, not an expectation: even a slim image carries dozens (wolfi-baselayout,
  # busybox, bash, glibc and the libraries PHP links), while an unreadable package
  # database yields none. Every step logs the real count, so tighten it from one.
  TRIVY_MIN_PACKAGES: "20"

jobs:
  # ------------------------------------------------------------- preflight
  # Everything tests/preflight.sh already checks without building an image:
  # matrix.gen.hcl drift, PGO tier coverage, bake --print + COMPILER
  # cross-check, shellcheck, the python unit suite, build-all.sh/bake target
  # list drift. Runs on every push and PR, beside `plan` rather than in front of
  # the images job: it catches a stale generated file or a shellcheck regression
  # in minutes, and what it gates is whatever publishes or moves a floating tag
  # (dev-manifest, promote) and the PR gate, not the builds themselves.
  preflight:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # tests/test-attest.sh pulls its registry images through the daemon.
      - name: Route Docker Hub pulls through mirror.gcr.io
        run: ./ci/hub-mirror.sh

      # Warm the daemon's image store under the retry policy; the action's
      # builder bootstrap otherwise pulls this image without that backoff.
      - name: Pull the pinned BuildKit image
        run: ./ci/retry.sh docker pull "$BUILDKIT_IMAGE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Ensure shellcheck is present
        run: |
          command -v shellcheck >/dev/null \
            || RETRY_KIND=net ./ci/retry.sh sudo sh -c 'apt-get -o Acquire::Retries=5 update && apt-get -o Acquire::Retries=5 install -y shellcheck'

      - name: tests/preflight.sh
        run: ./tests/preflight.sh

      # Not a gate: the Trivy step is what fails on an expired accepted risk.
      # This only puts the date in front of people two weeks ahead.
      - name: VEX review deadlines
        run: python3 ci/vex.py check --warn-within 14

      # tests/test-attest.sh: the publish-time attestation and promotion scripts
      # against two throwaway registries (GHCR-like and Docker Hub-like) and a
      # local key, in the merge and promote jobs' order.
      - name: Install Cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Install regctl
        run: ./ci/install-regctl.sh

      - name: tests/test-attest.sh
        run: ./tests/test-attest.sh

  # -------------------------------------------------------------------- plan
  # Everything the images job takes as a given, computed once per run, so no entry
  # does it again and no two entries can disagree:
  #   - the base image's signature (below), before any job builds on it;
  #   - the Wolfi index state, the inputs hash and the toolchain epoch;
  #   - the matrices (scripts/gen_matrix.py, the source tests/preflight.sh's
  #     bake --print cross-check trusts).
  # Runs on every event; the jobs that consume a matrix gate on the ref.
  #
  # `matrix` is one entry per (PHP version, uarch, arch) with every target of
  # that version in it (`--github version`, longest first, so the slowest
  # compiles start first and the short ones fill in behind them); a pull request
  # gets the bake `pr` subset (php-7_0-fpm, php-8_2-fpm, php-8_5-fpm,
  # php-8_5-cli-builder and php-8_5-cli, which carries ext-builder, plus the slim
  # riders php-8_5-fpm-slim, php-8_5-cli-slim and php-7_0-fpm-slim -- oldest and
  # newest ends, one mid-range version, the heaviest flavor, the extension
  # build stage and both slim flavors) on amd64 only (`--github pr`, the same
  # entry shape). The runner follows from an entry's `arch`.
  # `targets` is the full 78-target list for merge, promote and hub-verify.
  #
  # Preflight runs beside this job and gates nothing that builds: only what
  # publishes or moves a floating tag (dev-manifest, promote) and the PR gate
  # wait for it.
  #
  # `mode` is `build`, or `reuse` for a develop push or dispatch whose images the
  # newest green develop run already built from the same inputs (ci/reuse_plan.py
  # lists the conditions; the reason is in the step summary). A reuse run skips
  # the corpus, the sources and every bake, and its `images` entries only test.
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # the develop runs and their release-candidate artifact (reuse)
    env:
      # Repository variable: a forced toolchain refresh before the week ends,
      # for example 2026-W48.1 (see ci/toolchain-epoch.sh). Empty: the epoch.
      TOOLCHAIN_EPOCH_OVERRIDE: ${{ vars.TOOLCHAIN_EPOCH_OVERRIDE }}
    outputs:
      wolfi-index-state: ${{ steps.wolfi.outputs.index-state }}
      inputs-hash: ${{ steps.hash.outputs.inputs-hash }}
      toolchain-epoch: ${{ steps.epoch.outputs.toolchain-epoch }}
      cache-week: ${{ steps.epoch.outputs.cache-week }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      targets: ${{ steps.matrix.outputs.targets }}
      mode: ${{ steps.reuse.outputs.mode }}
      ci-hash: ${{ steps.hash.outputs.ci-hash }}
      promote: ${{ steps.promote.outputs.promote }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # Every digest the tree pins for the base (matrix.json, the Dockerfile's
      # and the bootstrap Dockerfile's ARG default) must carry Chainguard's
      # keyless signature before any job builds on it. Identity and issuer are
      # the ones Chainguard documents for its public images (the "Provenance"
      # tab of https://images.chainguard.dev/directory/image/wolfi-base: the
      # chainguard-images/images release workflow on main); the signing
      # certificate of the pinned digest carries exactly this SAN.
      - name: Verify the base image signature
        run: |
          set -euo pipefail
          refs="$(grep -ohE 'cgr\.dev/chainguard/wolfi-base:[^@" ]+@sha256:[a-f0-9]{64}' \
            matrix.json Dockerfile php/pgo/Dockerfile.bootstrap-corpus | sort -u)"
          [ -n "$refs" ] || { echo "FAIL: no pinned wolfi-base reference found" >&2; exit 1; }
          while read -r ref; do
            echo "verifying ${ref%%:*}@${ref##*@}"
            ./ci/retry.sh cosign verify "${ref%%:*}@${ref##*@}" \
              --certificate-identity-regexp '^https://github\.com/chainguard-images/images/\.github/workflows/release\.yaml@refs/heads/main$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          done <<<"$refs"

      # Wolfi's index changes many times a day. Computed here once and handed to
      # every images entry on both architectures through needs.plan,
      # so the image that was verified is built from the same index as the one
      # that is published. The runtime apk-upgrade layer rebuilds whenever this
      # value moved; the compile stages key on the toolchain epoch instead.
      - name: Pin the Wolfi index state for every build leg
        id: wolfi
        run: |
          set -euo pipefail
          WOLFI_INDEX_STATE="$(./ci/wolfi-index-state.sh)"
          [ -n "$WOLFI_INDEX_STATE" ] || { echo "::error::ci/wolfi-index-state.sh printed no index state"; exit 1; }
          echo "index-state=$WOLFI_INDEX_STATE" >> "$GITHUB_OUTPUT"

      - name: Compute the inputs hash
        id: hash
        run: |
          set -euo pipefail
          hash="$(./scripts/inputs-hash.sh)"
          [ -n "$hash" ] || { echo "::error::scripts/inputs-hash.sh printed no hash"; exit 1; }
          echo "inputs-hash=$hash" >> "$GITHUB_OUTPUT"
          # How the images are built (bake flags, SBOM, provenance, tests) is not
          # in the inputs hash; a reuse or a copy only trusts images built under
          # this very file.
          ci_hash="$(sha256sum .github/workflows/ci.yml | cut -d' ' -f1)"
          [[ "$ci_hash" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no sha256 of ci.yml"; exit 1; }
          echo "ci-hash=$ci_hash" >> "$GITHUB_OUTPUT"

      # The pull request that promotes develop: same repository, head develop,
      # base main. `promote-check` decides whether `images` runs for it.
      - name: Recognize the promote pull request
        id: promote
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          promote=false
          if [ "$EVENT_NAME" = pull_request ] && [ "$HEAD_REF" = develop ] && [ "$BASE_REF" = main ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            promote=true
          fi
          echo "promote=$promote" >> "$GITHUB_OUTPUT"

      # The toolchain layers (and with them the registry cache scope) turn over
      # weekly; CACHE_WEEK is the epoch without a forced-refresh `.N` suffix.
      - name: Compute the toolchain epoch
        id: epoch
        run: |
          set -euo pipefail
          EP="$(./ci/toolchain-epoch.sh)"
          {
            echo "toolchain-epoch=$EP"
            echo "cache-week=${EP%%.*}"
          } >> "$GITHUB_OUTPUT"

      - name: Emit the matrices
        id: matrix
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            matrix="$(python3 scripts/gen_matrix.py --github pr | jq -ce '.include | select(length > 0)')"
          else
            matrix="$(python3 scripts/gen_matrix.py --github version | jq -ce '.include | select(length > 0)')"
          fi
          targets="$(python3 scripts/gen_matrix.py --github targets | jq -ce '.include | select(length > 0)')"
          {
            echo "matrix=$matrix"
            echo "targets=$targets"
          } >> "$GITHUB_OUTPUT"

      # Never fails the run: anything unreadable or unexpected is a build, with
      # the reason in the summary. The verified candidate goes to this run's
      # `images` entries as an artifact, so they all read the one file the
      # decision was made on.
      - name: Decide whether to reuse the last develop build
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REBUILD: ${{ inputs.rebuild }}
          INPUTS_HASH: ${{ steps.hash.outputs.inputs-hash }}
          CI_HASH: ${{ steps.hash.outputs.ci-hash }}
          TARGETS: ${{ steps.matrix.outputs.targets }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reuse"
          printf '%s\n' "$TARGETS" > "$RUNNER_TEMP/targets.json"
          decision="$(python3 ci/reuse_plan.py plan --repo "$GITHUB_REPOSITORY" --event "$EVENT_NAME" --ref "$GITHUB_REF" \
            --rebuild "$REBUILD" --inputs-hash "$INPUTS_HASH" --ci-hash "$CI_HASH" --targets "$RUNNER_TEMP/targets.json" --dev-repo "$DEV_REPO" \
            --run-id "$GITHUB_RUN_ID" --save-candidate "$RUNNER_TEMP/reuse/release-candidate.json")" || {
            echo "::warning::ci/reuse_plan.py failed; building"
            decision='{"mode":"build","reason":"ci/reuse_plan.py failed"}'
          }
          mode="$(jq -er .mode <<<"$decision")"
          reason="$(jq -er .reason <<<"$decision")"
          echo "mode=$mode: $reason"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          printf '### Images: %s\n\n%s\n' "$mode" "$reason" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the candidate to reuse
        if: ${{ steps.reuse.outputs.mode == 'reuse' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reuse-candidate
          path: ${{ runner.temp }}/reuse/release-candidate.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # ---------------------------------------------------------- release-source
  # Decides, on a push to main, whether the release copies the images develop
  # already built and tested (`copy`) or builds them (`rebuild`); see the header
  # of ci/release_source.py for the rules. Runs on every event so that the jobs
  # that read its output are never skipped by a skipped need; the decision is
  # made only for a push to main, and anything else leaves the mode empty, which
  # is a build. Never fails the run on an unreadable GitHub: that is a rebuild,
  # with the reason in the summary. The verified candidate goes to the `merge`
  # legs as an artifact, so every leg reads the one file the decision was made on.
  #
  # The job's outputs are written by its last step, which runs only when every
  # step before it succeeded: a job that fails anywhere (the decision script, the
  # candidate upload) has no mode, which every consumer reads as a build, and the
  # consumers that would otherwise be skipped with it (`sources`, `corpus`) run on
  # `!cancelled()` instead of the implicit success of their needs.
  release-source:
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # develop's ci runs, the extended run and the release-candidate artifact
      statuses: read # the release/extended commit status
    outputs:
      mode: ${{ steps.publish.outputs.mode }}
      run-id: ${{ steps.publish.outputs.run-id }}
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      # Two commits deep: the merge commit and both its parents, which is all
      # the tree comparison reads.
      - name: Checkout
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Decide between copying develop's images and building
        id: decide
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_HASH: ${{ needs.plan.outputs.inputs-hash }}
          CI_HASH: ${{ needs.plan.outputs.ci-hash }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          RELEASE_HOLD: ${{ vars.RELEASE_HOLD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/copy"
          printf '%s\n' "$TARGETS" > "$RUNNER_TEMP/targets.json"
          decision="$(python3 ci/release_source.py decide --mode main --repo "$GITHUB_REPOSITORY" --inputs-hash "$INPUTS_HASH" \
            --ci-hash "$CI_HASH" --targets "$RUNNER_TEMP/targets.json" --dev-repo "$DEV_REPO" --hold "$RELEASE_HOLD" \
            --save-candidate "$RUNNER_TEMP/copy/release-candidate.json")" || {
            echo "::warning::ci/release_source.py failed; building"
            decision='{"mode":"rebuild","reason":"ci/release_source.py failed"}'
          }
          mode="$(jq -er .mode <<<"$decision")"
          reason="$(jq -er .reason <<<"$decision")"
          if [ "$mode" = copy ]; then
            run_id="$(jq -er .run_id <<<"$decision")"
            sha="$(jq -er .sha <<<"$decision")"
            if [[ ! "$run_id" =~ ^[0-9]+$ ]] || [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              mode=rebuild
              reason="ci/release_source.py named a run '$run_id' and a commit '$sha'"
            fi
          fi
          echo "mode=$mode: $reason"
          {
            echo "mode=$mode"
            if [ "$mode" = copy ]; then
              echo "run-id=$run_id"
              echo "sha=$sha"
            fi
          } >> "$GITHUB_OUTPUT"
          printf '### Release: %s\n\n%s\n' "$mode" "$reason" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the verified candidate
        if: ${{ steps.decide.outputs.mode == 'copy' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copy-candidate
          path: ${{ runner.temp }}/copy/release-candidate.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Publish the decision
        id: publish
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          MODE: ${{ steps.decide.outputs.mode }}
          RUN_ID: ${{ steps.decide.outputs.run-id }}
          SHA: ${{ steps.decide.outputs.sha }}
        run: |
          {
            echo "mode=$MODE"
            echo "run-id=$RUN_ID"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- trivy-db
  # One vulnerability DB refresh per run, parallel with plan, instead of
  # every images entry racing the registry and the same dated cache key.
  # The artifact gives every architecture the same DB for its scan and recorded
  # test-result predicate; a failed refresh stops those entries before they build.
  trivy-db:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.SETUP_TRIVY_VERSION }}
          cache: true

      - name: Date for the Trivy DB cache key
        id: trivy_date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore the Trivy DB cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-${{ steps.trivy_date.outputs.date }}
          restore-keys: cache-trivy-

      # A dated cache hit can still need an update: the immutable daily entry
      # can outlive the DB's next-update time. Refresh it here once, then share
      # the refreshed files even when the existing cache key cannot be replaced.
      # The DB is an OCI artifact, so registry failures go through the retry policy.
      - name: Download the Trivy DB
        run: ./ci/retry.sh trivy --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" image --download-db-only

      # Include the whole cache directory, including hidden files, so consumers
      # restore exactly what the pinned Trivy release downloaded.
      - name: Upload this run's Trivy DB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-db
          path: ${{ github.workspace }}/.cache/trivy
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error

      # CISA's Known Exploited Vulnerabilities catalog, one snapshot per run for
      # the KEV gate in every matrix leg (ci/kev.py validates its shape).
      - name: Download the CISA KEV catalog
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.cache/kev"
          RETRY_KIND=http ./ci/retry.sh curl --fail --silent --show-error --location \
            --output "$GITHUB_WORKSPACE/.cache/kev/known_exploited_vulnerabilities.json" \
            https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json

      - name: Upload this run's KEV catalog
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kev-catalog
          path: ${{ github.workspace }}/.cache/kev
          retention-days: 1
          if-no-files-found: error

  # ----------------------------------------------------------------- sources
  # Every sha-pinned source tarball the build fetches (php-src, PECL, vendored
  # libraries, the PGO corpus apps; ci/sources.sh list), downloaded once per lock
  # change into an actions cache instead of from php.net, PECL, GitHub and
  # SourceForge in every build leg. The legs restore it and seed their builder's
  # php-src-cache mount before the first bake. A miss anywhere only means that
  # leg fetches the file itself: deps/fetch-verified.sh re-checks every sha256 it
  # reads from the mount, and a mount's content is not part of any cache key, so
  # the cache can never change what is built. A reuse run builds nothing and
  # skips it.
  sources:
    needs: [plan, release-source, promote-check]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.mode != 'reuse' && needs.release-source.outputs.mode != 'copy' && (needs.plan.outputs.promote != 'true' || (needs.promote-check.result == 'success' && needs.promote-check.outputs.copy == 'false')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore the pinned sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: restore
        with:
          path: ${{ runner.temp }}/php-src-cache
          key: php-src-${{ hashFiles('php/php-src.lock', 'php/pecl.lock', 'php/ext.json', 'deps/versions.lock', 'php/pgo/corpus.lock', 'ci/sources.sh') }}
          restore-keys: php-src-

      # Saved only when every pinned file arrived: a partial set under the exact
      # key would never be completed until a lock changed. A failure here never
      # fails a build leg (they do not need this job to succeed); it only means
      # the legs fetch the missing files themselves, as they always could.
      - name: Fetch whatever the cache lacks
        id: fetch
        run: ./ci/sources.sh fetch "$RUNNER_TEMP/php-src-cache"

      - name: Save the pinned sources
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/php-src-cache
          key: php-src-${{ hashFiles('php/php-src.lock', 'php/pecl.lock', 'php/ext.json', 'deps/versions.lock', 'php/pgo/corpus.lock', 'ci/sources.sh') }}

  # ------------------------------------------------------------------ images
  # One job per matrix entry of `plan`: one PHP version x microarchitecture x
  # architecture, natively on that architecture's runner, no QEMU. It builds every
  # target of the entry in one `docker buildx bake` call (BuildKit builds the
  # shared php-build stage once), mounts each target's tier corpus by its
  # hash-pinned GHCR ref, then tests the images with ci/test-images.sh: smoke,
  # slim parity, the ext-builder end-to-end test, and the Trivy, KEV, package-floor
  # and AGPL gates. No Docker Hub login and no `release` environment: every
  # Docker Hub base image is read anonymously, through the mirrors.
  #
  #   pull request   `--load` into the local daemon, tested as loaded. Nothing is
  #                  pushed. The registry cache is read-only, and absent for a
  #                  fork's pull request.
  #   develop        pushed by digest (SBOM + max provenance) to php/dev, pulled
  #                  back and tested by that digest. Targets that passed get
  #                  dev:<tag>-<sha12>-<arch> (ci/dev-tag.sh, which dev-manifest
  #                  joins) and a digest-<target>-<arch> artifact. The `candidate`
  #                  job records the whole run once every entry passed.
  #   main           pushed by digest to the staging repository php/release,
  #                  tested the same way; the digest-<target>-<arch> artifacts are
  #                  what `merge` assembles, signs and attests. Nothing is
  #                  pullable under a real name until merge tags it.
  # What gets tested and merged is byte-for-byte what was pushed, never a separate
  # --load build that could drift if a base layer refreshed between two builds.
  #
  # A reuse run (`plan`'s mode, develop only) skips the corpus, the sources, the
  # builder and the bake: the entry's index digests come from the candidate
  # `plan` verified (ci/reuse_plan.py entry), and everything from the test on
  # runs as for a build. The test uses this run's Trivy DB, so a CVE published
  # since the build still fails the entry, and the smoke test still refuses an
  # image whose inputs-hash label differs from this tree's. The PGO check is the
  # one thing left out (SMOKE_SKIP_PGO): it compares the image with the tier's
  # corpus, which is not pulled, and both are the ones the previous run checked,
  # since the hash that names the corpus is unchanged. The new dev tags and the
  # candidate record carry the original build's time and run.
  #
  # The registry cache (CACHE_REGISTRY/cache:<php>-<uarch>-<arch>-<week>) is
  # written on develop and main by the entry's deps-cache target in the same bake
  # call, and read by every build. The package is public: reading it needs no login.
  #
  # A pull request that changes any build input (a Renovate base-digest bump, say)
  # has an inputs hash no corpus job has built, so its hash-pinned corpus ref does
  # not exist: it is graded against the tier's last published corpus. A pull
  # request that changes the PGO corpus itself is not re-trained by its own gate
  # (the corpus jobs run only on develop and main). develop and main never fall
  # back.
  #
  # `!cancelled()` plus explicit result checks instead of the implicit success
  # gate: corpus-merge is skipped on a pull request, and one failed corpus tier
  # on develop or main must only fail the entries that mount it, not skip every
  # other entry.
  #
  # A failed test leaves the targets that passed their tags and artifacts (the
  # steps after the test run unless the run was canceled) and fails the job.
  images:
    needs: [plan, release-source, promote-check, corpus-merge, trivy-db, sources]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.trivy-db.result == 'success' && needs.release-source.outputs.mode != 'copy' && (needs.plan.outputs.promote != 'true' || (needs.promote-check.result == 'success' && needs.promote-check.outputs.copy == 'false')) && (github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') }}
    name: images ${{ matrix.job.name }}
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.job.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 240
    permissions:
      contents: read
      # GHCR: the corpus pull, the cache push, and the develop and main image pushes.
      # A pull request never pushes (and a fork's token is read-only whatever is
      # asked for here).
      packages: write
    env:
      WOLFI_INDEX_STATE: ${{ needs.plan.outputs.wolfi-index-state }}
      INPUTS_HASH: ${{ needs.plan.outputs.inputs-hash }}
      TOOLCHAIN_EPOCH: ${{ needs.plan.outputs.toolchain-epoch }}
      CACHE_WEEK: ${{ needs.plan.outputs.cache-week }}
      ENTRY_NAME: ${{ matrix.job.name }}
      ENTRY_BAKE: ${{ matrix.job.bake }}
      TARGET_CORPUS: ${{ matrix.job.corpus }}
      PLATFORM: ${{ matrix.job.platform }}
      ARCH: ${{ matrix.job.arch }}
      # The org.opencontainers.image.revision label (and the dev tag's sha).
      REVISION: ${{ github.sha }}
      # One severity list for the Trivy gates and the recorded predicate.
      TRIVY_SEVERITY: CRITICAL,HIGH
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk
        run: ci/free-disk.sh

      # Install the pinned binary and use this run's prepared DB. Every scan
      # skips setup, cache restore and DB updates, so entries make no DB
      # registry requests after a long build.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.SETUP_TRIVY_VERSION }}
          cache: true

      - name: Download this run's Trivy DB
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trivy-db
          path: ${{ github.workspace }}/.cache/trivy

      - name: Download this run's KEV catalog
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kev-catalog
          path: ${{ github.workspace }}/.cache/kev

      - name: Install regctl
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        run: ./ci/install-regctl.sh

      # The BuildKit image is pulled by this daemon: mirror.gcr.io first, Docker
      # Hub when the mirror misses a blob.
      - name: Route Docker Hub pulls through mirror.gcr.io
        run: ./ci/hub-mirror.sh

      # Warm the daemon's image store under the retry policy; the action's
      # builder bootstrap otherwise pulls this image without that backoff.
      - name: Pull the pinned BuildKit image
        if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: ./ci/retry.sh docker pull "$BUILDKIT_IMAGE"

      - name: Set up Docker Buildx
        if: ${{ needs.plan.outputs.mode != 'reuse' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
          # Base images resolve through mirror.gcr.io, then public.ecr.aws's copy
          # of Docker's official images (BuildKit takes a mirror with a path),
          # then Docker Hub itself -- anonymously in every case: no job that
          # builds holds Docker Hub credentials. Every FROM is digest-pinned, so
          # no source can change what is built: BuildKit checks the digest it
          # gets. Pushes go to GHCR, never to a mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io", "public.ecr.aws/docker"]

      # The run's source tarballs (see the sources job), into this builder's
      # php-src-cache mount. Whatever is missing the build fetches itself, so
      # one dead upstream URL only fails the entries that need it; neither step
      # can change what is built.
      - name: Restore the pinned sources
        if: ${{ needs.plan.outputs.mode != 'reuse' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/php-src-cache
          key: php-src-${{ hashFiles('php/php-src.lock', 'php/pecl.lock', 'php/ext.json', 'deps/versions.lock', 'php/pgo/corpus.lock', 'ci/sources.sh') }}
          restore-keys: php-src-

      - name: Seed the builder's source cache
        if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: |
          if [ -n "$(ls -A "$RUNNER_TEMP/php-src-cache" 2>/dev/null)" ]; then
            ./ci/retry.sh ./ci/sources.sh seed "$RUNNER_TEMP/php-src-cache"
          else
            echo "::warning::no source cache restored; the build fetches its sources itself"
          fi

      - name: Log in to GHCR (corpus pull, image pull, image and cache push)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PUSH_REPO empty: a pull request, built with --load. Otherwise where the
      # images are pushed by digest. CREATED is the one build timestamp of the
      # entry's images (the OCI created label) and of its candidate record, and
      # BUILT_RUN the run that built them; a reuse run takes both from the
      # candidate it reuses (below).
      - name: Resolve the mode and the build settings
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          ENTRY_JSON: ${{ toJson(matrix.job) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$ENTRY_JSON" > "$RUNNER_TEMP/entry.json"
          targets="$(jq '.targets | length' "$RUNNER_TEMP/entry.json")"
          [ "$targets" -ge 1 ] && [ "$targets" -le 6 ] || {
            echo "FAIL: entry $ENTRY_NAME has $targets targets; the digest upload steps below cover 1 to 6" >&2
            exit 1
          }
          {
            echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "BUILT_RUN=$GITHUB_RUN_ID"
            if [ "$EVENT_NAME" = pull_request ]; then
              echo "PUSH_REPO="
              echo "CACHE_PUSH=false"
              if [ "$IS_FORK" = true ]; then echo "CACHE_REGISTRY="; else echo "CACHE_REGISTRY=ghcr.io/lotuswebagency/php"; fi
            else
              if [ "$GITHUB_REF" = refs/heads/develop ]; then echo "PUSH_REPO=$DEV_REPO"; else echo "PUSH_REPO=$STAGE_IMAGE"; fi
              echo "PUSH=true"
              echo "CACHE_PUSH=true"
              echo "CACHE_REGISTRY=ghcr.io/lotuswebagency/php"
            fi
          } >> "$GITHUB_ENV"

      - name: Download the candidate this run reuses
        if: ${{ needs.plan.outputs.mode == 'reuse' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reuse-candidate
          path: ${{ runner.temp }}/reuse

      # What the Build step leaves in digests.json, read from the candidate
      # instead: this entry's targets on its architecture. A candidate that lacks
      # one fails the entry (plan already checked the whole matrix).
      - name: Take the reused images' digests from the candidate
        if: ${{ needs.plan.outputs.mode == 'reuse' }}
        run: |
          set -euo pipefail
          [ "$PUSH_REPO" = "$DEV_REPO" ] || { echo "FAIL: reuse is for develop; PUSH_REPO is '$PUSH_REPO'" >&2; exit 1; }
          meta="$(python3 ci/reuse_plan.py entry --candidate "$RUNNER_TEMP/reuse/release-candidate.json" \
            --entry "$RUNNER_TEMP/entry.json" --digests-out "$RUNNER_TEMP/digests.json")"
          {
            echo "CREATED=$(jq -er .created <<<"$meta")"
            echo "BUILT_RUN=$(jq -er .built_run <<<"$meta")"
          } >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/digests.json"
          echo "reusing the images run $(jq -er .built_run <<<"$meta") built at $(jq -er .created <<<"$meta")"

      - name: Pull and verify this entry's hash-pinned PGO corpus
        if: ${{ needs.plan.outputs.mode != 'reuse' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          corpus_ref="${TARGET_CORPUS}-${INPUTS_HASH}"
          pull_err="$RUNNER_TEMP/corpus-pull.err"
          if ! ./ci/retry.sh docker pull "$corpus_ref" 2>"$pull_err"; then
            cat "$pull_err" >&2
            if [ "$EVENT_NAME" = pull_request ] && grep -qiE 'manifest unknown|not found' "$pull_err"; then
              echo "::warning::$corpus_ref does not exist (this PR changes a build input); grading against the last published $TARGET_CORPUS"
              ./ci/retry.sh docker pull "$TARGET_CORPUS"
              echo "CORPUS_REF=$TARGET_CORPUS" >> "$GITHUB_ENV"
              exit 0
            fi
            exit 1
          fi
          label_hash="$(docker inspect --format '{{index .Config.Labels "com.lotuswebagency.inputs-hash"}}' "$corpus_ref")"
          [ "$label_hash" = "$INPUTS_HASH" ] || {
            echo "FAIL: $corpus_ref carries inputs-hash '$label_hash', expected '$INPUTS_HASH'" >&2
            exit 1
          }
          echo "ok: $corpus_ref inputs-hash matches this tree"
          # test-pgo.sh (via smoke.sh) reads the tier's MANIFEST by its floating
          # tag; point that tag at the corpus just verified, never a pulled one.
          docker tag "$corpus_ref" "$TARGET_CORPUS"
          echo "CORPUS_REF=$corpus_ref" >> "$GITHUB_ENV"

      # One bake call for the whole entry: every target, plus the deps-cache
      # target of its fpm image when the cache is written. `*.contexts.corpus`
      # hands every target the same hash-pinned corpus -- a target left on the
      # floating ref would be a second php-build. The `php-*` globs leave the
      # deps-cache target (cache output only, no image) out of the tags and the
      # push-by-digest output.
      #
      # A push retries transient registry, HTTP and apk failures with a warm
      # layer cache, five attempts (30s to 5min waits); deterministic build
      # failures are not retried. Safe for a push by digest: every attempt starts
      # by deleting metadata.json, so the digests read below are the ones the
      # attempt that succeeded wrote, and nothing else carries a digest forward.
      # Whatever a failed attempt pushed stays an untagged, unreferenced orphan.
      - name: Build
        if: ${{ needs.plan.outputs.mode != 'reuse' }}
        run: |
          set -euo pipefail
          read -ra bake_targets <<<"$ENTRY_BAKE"
          if [ "$CACHE_PUSH" = true ]; then
            bake_targets+=("deps-cache-$(jq -er '[.targets[] | select(.flavor == "fpm")][0].name' "$RUNNER_TEMP/entry.json")")
          fi
          mode_args=(--load)
          if [ -n "$PUSH_REPO" ]; then
            mode_args=(
              --set "php-*.tags=$PUSH_REPO"
              --set "php-*.output=type=image,name=$PUSH_REPO,push=true,push-by-digest=true,name-canonical=true"
            )
          fi
          RETRY_KIND=registry,http,apk RETRY_ATTEMPTS=5 ./ci/retry.sh bash -c 'rm -f metadata.json; exec "$@"' retry-bake \
            docker buildx bake -f matrix.gen.hcl -f docker-bake.hcl "${bake_targets[@]}" \
            --set "*.platform=$PLATFORM" \
            --set "*.contexts.corpus=docker-image://$CORPUS_REF" \
            "${mode_args[@]}" \
            --metadata-file metadata.json
          [ -n "$PUSH_REPO" ] || exit 0
          # {"<target name>": "<repo>@sha256:<index digest>"}: the images to test.
          jq --arg repo "$PUSH_REPO" --slurpfile entry "$RUNNER_TEMP/entry.json" '
            . as $meta
            | [$entry[0].targets[].name | . as $name
               | {key: $name, value: ($meta[$name]["containerimage.digest"] as $d | if $d then "\($repo)@\($d)" else "" end)}]
            | from_entries' metadata.json > "$RUNNER_TEMP/digests.json"
          cat "$RUNNER_TEMP/digests.json"

      # Smoke, slim parity, ext-builder, Trivy/KEV/floor/license, one target after
      # another (see ci/test-images.sh); pushed images are pulled back by digest,
      # and a passing one gets its signed test-result predicate.
      - name: Test the images
        id: test
        env:
          SMOKE_SKIP_PGO: ${{ needs.plan.outputs.mode == 'reuse' && '1' || '' }}
        run: |
          set -euo pipefail
          args=(--mode load)
          [ -z "$PUSH_REPO" ] || args=(--mode digest --digests "$RUNNER_TEMP/digests.json")
          ./ci/test-images.sh --entry "$RUNNER_TEMP/entry.json" --out "$RUNNER_TEMP/test-out" "${args[@]}"

      - name: Upload the test logs
        if: ${{ !cancelled() && steps.test.conclusion != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-${{ matrix.job.name }}
          path: ${{ runner.temp }}/test-out
          if-no-files-found: ignore
          overwrite: true
          retention-days: 5

      # Per passed target: its digest file and test-result predicate, laid out as
      # the merge job reads them (<arch> and <arch>.test-result.json at the
      # artifact's root). A target that did not pass has no directory, so its
      # upload finds nothing and merge fails on the missing artifact.
      - name: Stage the passed targets' digests
        id: stage
        if: ${{ !cancelled() && steps.test.conclusion != 'skipped' && github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          [ -f "$RUNNER_TEMP/test-out/passed.txt" ] || exit 0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            mkdir -p "$RUNNER_TEMP/stage/$name"
            cp "$RUNNER_TEMP/test-out/$name/artifact/"* "$RUNNER_TEMP/stage/$name/"
          done < "$RUNNER_TEMP/test-out/passed.txt"

      # The artifact name is the full target name. Several target names share a
      # prefix ("-cli"/"-cli-builder", "-fpm"/"-fpm-v3"), so the merge job must
      # download each artifact by its exact name, never by a prefix pattern. An
      # Actions step cannot loop, so one step per slot of the entry's targets;
      # the step above refuses an entry with more than six.
      - name: Upload digest (target 1)
        if: ${{ !cancelled() && steps.stage.conclusion == 'success' && matrix.job.targets[0] }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.job.targets[0].name }}-${{ matrix.job.arch }}
          path: ${{ runner.temp }}/stage/${{ matrix.job.targets[0].name }}
          if-no-files-found: ignore
          retention-days: ${{ github.ref == 'refs/heads/main' && 1 || 10 }}
          overwrite: true

      - name: Upload digest (target 2)
        if: ${{ !cancelled() && steps.stage.conclusion == 'success' && matrix.job.targets[1] }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.job.targets[1].name }}-${{ matrix.job.arch }}
          path: ${{ runner.temp }}/stage/${{ matrix.job.targets[1].name }}
          if-no-files-found: ignore
          retention-days: ${{ github.ref == 'refs/heads/main' && 1 || 10 }}
          overwrite: true

      - name: Upload digest (target 3)
        if: ${{ !cancelled() && steps.stage.conclusion == 'success' && matrix.job.targets[2] }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.job.targets[2].name }}-${{ matrix.job.arch }}
          path: ${{ runner.temp }}/stage/${{ matrix.job.targets[2].name }}
          if-no-files-found: ignore
          retention-days: ${{ github.ref == 'refs/heads/main' && 1 || 10 }}
          overwrite: true

      - name: Upload digest (target 4)
        if: ${{ !cancelled() && steps.stage.conclusion == 'success' && matrix.job.targets[3] }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.job.targets[3].name }}-${{ matrix.job.arch }}
          path: ${{ runner.temp }}/stage/${{ matrix.job.targets[3].name }}
          if-no-files-found: ignore
          retention-days: ${{ github.ref == 'refs/heads/main' && 1 || 10 }}
          overwrite: true

      - name: Upload digest (target 5)
        if: ${{ !cancelled() && steps.stage.conclusion == 'success' && matrix.job.targets[4] }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.job.targets[4].name }}-${{ matrix.job.arch }}
          path: ${{ runner.temp }}/stage/${{ matrix.job.targets[4].name }}
          if-no-files-found: ignore
          retention-days: ${{ github.ref == 'refs/heads/main' && 1 || 10 }}
          overwrite: true

      - name: Upload digest (target 6)
        if: ${{ !cancelled() && steps.stage.conclusion == 'success' && matrix.job.targets[5] }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.job.targets[5].name }}-${{ matrix.job.arch }}
          path: ${{ runner.temp }}/stage/${{ matrix.job.targets[5].name }}
          if-no-files-found: ignore
          retention-days: ${{ github.ref == 'refs/heads/main' && 1 || 10 }}
          overwrite: true

      # Only targets that passed every test above get a per-arch tag, so a tag
      # on php/dev is a tested image; dev-manifest joins the arches.
      - name: Tag the passed targets (develop)
        if: ${{ !cancelled() && steps.test.conclusion != 'skipped' && github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' }}
        env:
          # An existing per-arch tag of this commit moves to another digest only on purpose: a
          # rebuild dispatch or a re-run attempt (ci/dev-tag.sh). A rebuild dispatch leaves a
          # develop run of this commit newer than the one an extended run tested, so
          # ci/release_source.py rebuilds the release of this commit; a re-run attempt is
          # another attempt, which the extended run's title must name.
          DEV_TAG_FORCE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.rebuild) || github.run_attempt != '1') && '1' || '' }}
        run: ./ci/dev-tag.sh "$RUNNER_TEMP/entry.json" "$RUNNER_TEMP/test-out"

      # Reached only when the whole entry passed (success() is the default): the
      # candidate job refuses an incomplete set, and a failed entry fails it.
      - name: Record the entry for the release candidate (develop)
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate"
          python3 ci/candidate.py entry --entry "$RUNNER_TEMP/entry.json" --out "$RUNNER_TEMP/test-out" \
            --created "$CREATED" --built-run "$BUILT_RUN" --repository "$DEV_REPO" > "$RUNNER_TEMP/candidate/$ENTRY_NAME.json"

      - name: Upload the candidate record (develop)
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.job.name }}
          path: ${{ runner.temp }}/candidate/${{ matrix.job.name }}.json
          if-no-files-found: error
          retention-days: 10
          overwrite: true

      # Last, whatever happened above.
      - name: Disk usage
        if: always()
        run: ci/free-disk.sh report

  # --------------------------------------------------------------- candidate
  # develop only. The release candidate of this run: the commit, its tree, the
  # inputs hash, and for every target and architecture the index digest, the
  # platform digest, and the build time and build run of the tested image on
  # php/dev (a reuse run keeps the original build's, so `created` is always when
  # the image was built), and the sha256 of this ci.yml, which a reuse or a copy
  # only trusts when it is the same. Written only when every entry built or reused and
  # passed (ci/candidate.py refuses a missing target or architecture), so the
  # file existing means the commit's whole matrix is tested and pushed.
  candidate:
    needs: [images, plan]
    if: ${{ !cancelled() && needs.images.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TARGETS: ${{ needs.plan.outputs.targets }}
      INPUTS_HASH: ${{ needs.plan.outputs.inputs-hash }}
      CI_HASH: ${{ needs.plan.outputs.ci-hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the entries' records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-*
          path: ${{ runner.temp }}/records

      - name: Write release-candidate.json
        run: |
          set -euo pipefail
          printf '%s\n' "$TARGETS" > "$RUNNER_TEMP/targets.json"
          python3 ci/candidate.py merge --targets "$RUNNER_TEMP/targets.json" --records "$RUNNER_TEMP/records" \
            --sha "$GITHUB_SHA" --tree "$(git rev-parse 'HEAD^{tree}')" --inputs-hash "$INPUTS_HASH" \
            --ci-hash "$CI_HASH" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --out release-candidate.json
          jq . release-candidate.json

      - name: Upload release-candidate.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: release-candidate.json
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------- dev-manifest
  # develop only. Joins the per-arch dev images the images entries tagged into one
  # manifest list per target, dev:<tag>-<sha> (both arches present), and moves
  # the floating dev:<tag> onto it only when every images entry of this run
  # succeeded and the run's commit is still the head of develop, so the floating
  # set mixes commits at most inside the short second pass of the script (a
  # cancel or crash there can split it; the prune keeps both sha sets). One job
  # over all 78 targets, not a matrix: each target is a handful of manifest calls
  # and runners are scarce. A missing arch while images claims success is a bug
  # and fails the job; after a failed images entry the missing ones are only
  # reported. The logic is in ci/dev-manifest.sh.
  dev-manifest:
    needs: [images, preflight]
    if: ${{ !cancelled() && needs.images.result != 'skipped' && needs.preflight.result == 'success' && github.ref == 'refs/heads/develop' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # GHCR: the dev manifest lists and floating tags
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # imagetools talks directly to GHCR without a BuildKit builder, so this
      # job needs neither a BuildKit image pull nor a Docker Hub mirror.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the dev manifest lists and move the floating tags
        env:
          IMAGES_RESULT: ${{ needs.images.result }}
        run: ./ci/dev-manifest.sh

  # ---------------------------------------------------------------- fixtures
  # develop only. The application fixtures the `extended` suites run against
  # (tests/apps), built per architecture on a native runner and pushed to
  # ghcr.io/lotuswebagency/php/apptest, so extended's own fixtures job finds
  # them current instead of building them after this run. Same script and
  # registry as extended.yml's fixtures job (ci/extended-fixtures.sh leaves a
  # fixture whose recipe hash is current alone); no PHP image of this run is
  # needed, so it starts beside the builds once preflight is green.
  fixtures:
    needs: preflight
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' }}
    name: fixtures ${{ matrix.arch.name }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: amd64, runner: ubuntu-26.04 }
          - { name: arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write # GHCR: the app fixtures
    env:
      APPTEST_FIXTURE_REPO: ghcr.io/lotuswebagency/php/apptest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk
        run: ci/free-disk.sh

      - name: Route Docker Hub pulls through mirror.gcr.io
        run: ./ci/hub-mirror.sh

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the missing or stale fixtures
        run: ci/extended-fixtures.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixtures-logs-${{ matrix.arch.name }}
          path: ${{ runner.temp }}/extended-logs
          if-no-files-found: ignore
          overwrite: true
          retention-days: 5

      # Last, whatever happened above.
      - name: Disk usage
        if: always()
        run: ci/free-disk.sh report

  # ----------------------------------------------------------------- pr-gate
  # One aggregate required check instead of branch protection naming every images
  # matrix entry by hand: GitHub's per-leg check names include the matrix values
  # (php version, flavor...), so a version bump renames them and silently drops
  # coverage from a rule that names the old ones. pr-gate is the only check to
  # require (together with preflight, which it also depends on) and it fails
  # unless every entry that ran actually succeeded.
  pr-gate:
    needs: [preflight, plan, images, promote-check]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      PREFLIGHT: ${{ needs.preflight.result }}
      PLAN: ${{ needs.plan.result }}
      IMAGES: ${{ needs.images.result }}
      PROMOTE_CHECK: ${{ needs.promote-check.result }}
      COPY: ${{ needs.promote-check.outputs.copy }}
      PROMOTE: ${{ needs.plan.outputs.promote }}
    steps:
      - name: Require preflight, plan and the images (for the promote PR, the promote check, and the images unless main will copy)
        run: |
          echo "preflight:      $PREFLIGHT"
          echo "plan:           $PLAN"
          echo "images:         $IMAGES"
          echo "promote-check:  $PROMOTE_CHECK (copy: ${COPY:-n/a})"
          [ "$PREFLIGHT" = "success" ] || { echo "FAIL: preflight did not succeed" >&2; exit 1; }
          [ "$PLAN" = "success" ] || { echo "FAIL: plan did not succeed" >&2; exit 1; }
          if [ "$PROMOTE" = "true" ]; then
            [ "$PROMOTE_CHECK" = "success" ] || { echo "FAIL: promote-check did not succeed" >&2; exit 1; }
            if [ "$COPY" = "true" ]; then
              echo "ok: preflight, plan and promote-check succeeded; main will copy, nothing to build"
            elif [ "$COPY" = "false" ]; then
              [ "$IMAGES" = "success" ] || { echo "FAIL: main will rebuild and at least one images entry did not succeed" >&2; exit 1; }
              echo "ok: preflight, plan, promote-check and every images entry succeeded; main will rebuild"
            else
              echo "FAIL: promote-check made no decision" >&2; exit 1
            fi
          else
            [ "$IMAGES" = "success" ] || { echo "FAIL: at least one images entry did not succeed" >&2; exit 1; }
            echo "ok: preflight, plan and every images entry succeeded"
          fi

  # ----------------------------------------------------------- promote-check
  # Decides, for the pull request from develop to main, whether the push to main
  # that merging it makes would copy develop's images (ci/release_source.py, the same
  # checks `release-source` runs on that push): the merge ref has two parents, its
  # second is the PR head and its tree is the head's, the head's develop ci run
  # succeeded as a whole and built every image itself and is the newest develop run of
  # the head, the extended.yml run that its completion started (event workflow_run,
  # titled with the head and that run attempt) succeeded having pulled the images by
  # the digests of its release candidate, that candidate is complete, for this inputs hash and
  # this ci.yml and at most seven days old, and the repository variable RELEASE_HOLD
  # is empty. The output `copy` is `true` when all of that holds and `false`
  # otherwise, with the reason in the step summary: `images` then builds the
  # subset like for any pull request, and main rebuilds on the merge. Not eligible
  # is not a failure (it cannot always be: no extended run titled the new way
  # exists until main's extended.yml carries the run-name, so the first promotion
  # after that change is always a rebuild, and so is one whose develop run is
  # stale, reused images, or has no extended run yet). The job fails, and with it
  # `pr-gate`, only for a set RELEASE_HOLD, a merge ref that is not the PR head's
  # tree (second parent or tree), git failing, or a script error. No dispatch of
  # extended.yml can stand in for the run the copy needs. The decision is a hint
  # for the PR: `release-source` re-derives it on the merge commit.
  promote-check:
    needs: plan
    if: ${{ needs.plan.outputs.promote == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      statuses: read
    outputs:
      copy: ${{ steps.decide.outputs.copy }}
    steps:
      # The merge ref (the default for a pull request), two commits deep.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Decide whether main could copy develop's images
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_HASH: ${{ needs.plan.outputs.inputs-hash }}
          CI_HASH: ${{ needs.plan.outputs.ci-hash }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          RELEASE_HOLD: ${{ vars.RELEASE_HOLD }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TARGETS" > "$RUNNER_TEMP/targets.json"
          rc=0
          decision="$(python3 ci/release_source.py decide --mode promote --repo "$GITHUB_REPOSITORY" --inputs-hash "$INPUTS_HASH" \
            --ci-hash "$CI_HASH" --targets "$RUNNER_TEMP/targets.json" --dev-repo "$DEV_REPO" --hold "$RELEASE_HOLD" \
            --head-sha "$HEAD_SHA" --save-candidate "$RUNNER_TEMP/release-candidate.json" --output "$GITHUB_OUTPUT")" || rc=$?
          reason="$(jq -r '.reason // empty' <<<"$decision" 2>/dev/null || true)"
          [ -n "$reason" ] || reason="ci/release_source.py made no decision (rc $rc)"
          if [ "$rc" -ne 0 ]; then
            printf '### Promote check: failed\n\n%s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "FAIL: $reason" >&2
            exit 1
          fi
          if [ "$(jq -er .mode <<<"$decision")" = copy ]; then
            printf '### Promote check: main will copy\n\nThe images job is skipped.\n\n%s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "copy: $reason"
          else
            printf '### Promote check: main will rebuild\n\nThe images job builds the pull request subset.\n\n%s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "rebuild: $reason"
          fi

  # ------------------------------------------------------------ corpus-matrix
  # The 7 corpus tiers (scripts/pgo_tiers.py list) as a matrix for the corpus and
  # corpus-merge jobs, from the same source every other corpus-aware script reads.
  corpus-matrix:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tiers: ${{ steps.matrix.outputs.tiers }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: matrix
        run: |
          set -euo pipefail
          tiers="$(python3 scripts/pgo_tiers.py list | jq -R -s -ce '
            split("\n") | map(select(length > 0) | split("\t")) |
            map({floor: .[0], builder: .[2], tag: .[3]}) | select(length > 0)
          ')"
          echo "tiers=$tiers" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ corpus
  # One PGO corpus image per {tier, arch} (7 tiers x 2 arches = 14 legs), rebuilt
  # only when a tier's inputs change and published to GHCR under a per-arch,
  # hash-suffixed tag. corpus-merge assembles the two arches of each tier into one
  # multi-platform index. Runs before `images`, since every php target mounts its
  # tier's corpus. Runs on develop as well as main: the corpus is a GHCR image,
  # and develop's images entries mount it by its hash-pinned ref like main's do.
  #
  # One job per tier and arch rather than one job building all 7 tiers in a row:
  # that would be 7 bootstrap PHP compiles plus 7 application corpus builds on a
  # single runner, past any sensible timeout whenever a shared input changes.
  corpus:
    needs: [plan, corpus-matrix, release-source]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.corpus-matrix.result == 'success' && needs.plan.outputs.mode != 'reuse' && needs.release-source.outputs.mode != 'copy' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
    name: corpus ${{ matrix.tier.floor }} ${{ matrix.arch.name }}
    strategy:
      fail-fast: false
      matrix:
        tier: ${{ fromJson(needs.corpus-matrix.outputs.tiers) }}
        arch:
          - name: amd64
            runner: ubuntu-26.04
            platform: linux/amd64
          - name: arm64
            runner: ubuntu-26.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      TIER: ${{ matrix.tier.floor }}
      TIER_BUILDER: ${{ matrix.tier.builder }}
      TIER_TAG: ${{ matrix.tier.tag }}
      ARCH_NAME: ${{ matrix.arch.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job builds through the runner's own daemon (the `docker` driver
      # below, and plain `docker build`), which does not see the BuildKit mirror
      # setting of the images job: the daemon's registry-mirrors does.
      # Every Docker Hub base is digest-pinned, so the mirror cannot change what
      # is built, and the daemon falls back to Docker Hub, anonymously.
      - name: Route Docker Hub pulls through mirror.gcr.io
        run: ./ci/hub-mirror.sh

      # The docker driver, not the action's default docker-container:
      # Dockerfile.corpus and the bootstrap cli-builder Dockerfile FROM images
      # that may exist only in this runner's local daemon store (a just-loaded
      # bootstrap image, or the tier's previous corpus build). The isolated
      # BuildKit container of the docker-container driver cannot see that store
      # and fails with "pull access denied". The other jobs only reference pushed
      # registry refs, which docker-container pulls itself.
      - name: Set up Docker Buildx (docker driver -- FROM/inspect need the local image store)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute inputs hash
        run: echo "INPUTS_HASH=$(./scripts/inputs-hash.sh)" >> "$GITHUB_ENV"

      - name: Reuse this tier+arch's corpus from GHCR if unchanged
        id: reuse
        run: |
          set -euo pipefail
          per_arch_ref="${TIER_TAG}-${INPUTS_HASH}-${ARCH_NAME}"
          if ./ci/retry.sh docker manifest inspect "$per_arch_ref" >/dev/null 2>&1; then
            echo "ok: tier $TIER/$ARCH_NAME unchanged -- $per_arch_ref already in GHCR"
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
            # Best effort: when this tier's release cli-builder is already
            # published, build-corpus.sh finds it instead of bootstrapping.
            # The GHCR staging copy first (main's merge job tags it there),
            # Docker Hub anonymously through the mirror when it is not there.
            # Transient registry errors are retried, since a 429 would send the
            # leg into the slow bootstrap; "not found" falls through.
            staged="${STAGE_IMAGE}:${TIER_BUILDER#*:}"
            if ./ci/retry.sh docker pull --quiet "$staged" >/dev/null 2>&1; then
              docker tag "$staged" "$TIER_BUILDER"
              echo "note: pulled release builder $staged as $TIER_BUILDER"
            elif ./ci/retry.sh docker pull --quiet "$TIER_BUILDER" >/dev/null 2>&1; then
              echo "note: pulled published release builder $TIER_BUILDER"
            else
              echo "note: $TIER_BUILDER not available yet, build-corpus.sh will bootstrap"
            fi
          fi

      # The run's source tarballs (see the sources job), into this builder's
      # php-src-cache mount. Whatever is missing the build fetches itself, so
      # one dead upstream URL only fails the legs that need it; neither step
      # can change what is built.
      - name: Restore the pinned sources
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/php-src-cache
          key: php-src-${{ hashFiles('php/php-src.lock', 'php/pecl.lock', 'php/ext.json', 'deps/versions.lock', 'php/pgo/corpus.lock', 'ci/sources.sh') }}
          restore-keys: php-src-

      - name: Seed the builder's source cache
        if: steps.reuse.outputs.reused != 'true'
        run: |
          if [ -n "$(ls -A "$RUNNER_TEMP/php-src-cache" 2>/dev/null)" ]; then
            ./ci/retry.sh ./ci/sources.sh seed "$RUNNER_TEMP/php-src-cache"
          else
            echo "::warning::no source cache restored; the build fetches its sources itself"
          fi

      - name: Build this tier's corpus (skipped if reused)
        if: steps.reuse.outputs.reused != 'true'
        run: ./tests/build-corpus.sh "$TIER"

      - name: Publish this tier+arch's corpus (skipped if reused)
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          label_hash="$(docker inspect --format '{{index .Config.Labels "com.lotuswebagency.inputs-hash"}}' "$TIER_TAG" 2>/dev/null || true)"
          [ "$label_hash" = "$INPUTS_HASH" ] || {
            echo "FAIL: $TIER_TAG missing or stale after build-corpus.sh (label=$label_hash, want $INPUTS_HASH)" >&2
            exit 1
          }
          per_arch_ref="${TIER_TAG}-${INPUTS_HASH}-${ARCH_NAME}"
          docker tag "$TIER_TAG" "$per_arch_ref"
          ./ci/retry.sh docker push "$per_arch_ref"
          echo "ok: pushed $per_arch_ref"

  # ------------------------------------------------------------ corpus-merge
  # One multi-platform index per tier, assembled from the two per-arch,
  # hash-suffixed images the corpus job publishes, under both the floating
  # `php<tier>` ref (what every target's `contexts.corpus` names) and
  # `php<tier>-<inputs-hash>` (what images actually mounts).
  corpus-merge:
    needs: [plan, corpus, corpus-matrix, release-source]
    if: ${{ !cancelled() && needs.plan.outputs.mode != 'reuse' && needs.release-source.outputs.mode != 'copy' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
    name: corpus-merge ${{ matrix.tier.floor }}
    strategy:
      fail-fast: false
      matrix:
        tier: ${{ fromJson(needs.corpus-matrix.outputs.tiers) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      TIER_TAG: ${{ matrix.tier.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # imagetools talks directly to GHCR without a BuildKit builder, so this
      # job needs neither a BuildKit image pull nor a Docker Hub mirror.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute inputs hash
        run: echo "INPUTS_HASH=$(./scripts/inputs-hash.sh)" >> "$GITHUB_ENV"

      - name: Assemble this tier's multi-platform corpus index
        run: |
          set -euo pipefail
          hash_tag="${TIER_TAG}-${INPUTS_HASH}"
          amd64_ref="${hash_tag}-amd64"
          arm64_ref="${hash_tag}-arm64"
          for ref in "$amd64_ref" "$arm64_ref"; do
            ./ci/retry.sh docker manifest inspect "$ref" >/dev/null 2>&1 || {
              echo "FAIL: missing $ref -- its corpus leg did not succeed" >&2
              exit 1
            }
          done
          if ./ci/retry.sh docker manifest inspect "$hash_tag" >/dev/null 2>&1; then
            echo "ok: $hash_tag already published, nothing to assemble"
          else
            docker buildx imagetools create -t "$TIER_TAG" -t "$hash_tag" "$amd64_ref" "$arm64_ref"
            echo "ok: published $TIER_TAG and $hash_tag as a multi-platform index"
          fi

  # ------------------------------------------------------------------- merge
  # One job per target, all of it on GHCR: assemble the two per-arch digests
  # into a multi-arch manifest list in the staging repository, pushed by digest
  # with no tag (ci/create-list.sh), annotated with this run's id, attempt and
  # commit. The full-version tag X.Y.Z-flavor[-v3] is derived from the built
  # image and required to equal matrix.json's release -- a tag can never claim
  # a version the image does not contain. org.opencontainers.image.revision/
  # created are already on every per-arch image from the images job's
  # REVISION/CREATED bake vars. Then cosign-signs the list and every manifest
  # under it (--recursive), verifies every one of those signatures with the
  # documented identity (ci/verify-signed.sh), attests the list and verifies
  # each attestation the same way, and only then tags it in the staging
  # repository (this target's tags from scripts/gen_matrix.py, minus the Docker
  # Hub repository, plus the full-version tag) and records it for promote. No
  # Docker Hub credentials.
  #
  # The staging tags make the GHCR repository track what was last merged (the
  # corpus job takes its release cli-builders from there), and since they are
  # set last, only ever onto a signed and verified list; Docker Hub only gets a
  # tag once promote has copied the signed list there.
  #
  # `if: !cancelled()` instead of the implicit `needs: images` gate: one failed
  # leg must not skip every other target's publish and the weekly security
  # refresh along with it. Each target's own two-digest check below still fails
  # that target's merge leg; fail-fast: false leaves the others unaffected.
  merge:
    needs: [images, plan, release-source, trivy-db]
    # A build leaves `images` run; a copy leaves it skipped, and needs the Trivy DB
    # for the rescan.
    if: ${{ !cancelled() && ((needs.release-source.outputs.mode == 'copy' && needs.trivy-db.result == 'success') || needs.images.result != 'skipped') && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    name: merge ${{ matrix.target.name }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan.outputs.targets) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read # checkout, to read matrix.json for the image name
      packages: write # GHCR: the staged list, its tags, signatures and attestations
      id-token: write # cosign keyless OIDC
      actions: read # a copy: the digests and test results of the develop run
    env:
      SOURCE_RUN: ${{ needs.release-source.outputs.run-id }}
      TARGET_NAME: ${{ matrix.target.name }}
      TARGET_PHP: ${{ matrix.target.php }}
      TARGET_RELEASE: ${{ matrix.target.release }}
      TARGET_FLAVOR: ${{ matrix.target.flavor }}
      TARGET_UARCH: ${{ matrix.target.uarch }}
      TARGET_TAGS: ${{ toJson(matrix.target.tags) }}
      # What `cosign verify-attestation` is held to in ci/attest-image.sh: the
      # identity SECURITY.md documents, so a wrong identity fails the release
      # instead of a user.
      COSIGN_VERIFY_FLAGS: >-
        --certificate-oidc-issuer https://token.actions.githubusercontent.com
        --certificate-identity https://github.com/LotusWebAgency/php/.github/workflows/ci.yml@refs/heads/main
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive Docker Hub image from matrix.json
        run: echo "DOCKERHUB_IMAGE=docker.io/$(jq -r .image matrix.json)" >> "$GITHUB_ENV"

      # imagetools talks directly to GHCR without a BuildKit builder. The
      # version check below also pulls only from GHCR, so no Hub mirror is needed.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Exact artifact names, one download per arch: a `digest-${name}-*` pattern
      # would also match every other target whose name starts with this one's plus
      # a hyphen ("X.Y-cli" matches "X.Y-cli-builder"). The files inside are named
      # exactly "amd64"/"arm64", so both calls can share `path: digests`.
      - name: Download amd64 digest
        if: ${{ needs.release-source.outputs.mode != 'copy' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.target.name }}-amd64
          path: digests

      - name: Download arm64 digest
        if: ${{ needs.release-source.outputs.mode != 'copy' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.target.name }}-arm64
          path: digests

      # A copy: the same two artifacts, from the develop run whose images are being
      # released (the run the candidate names; ten days of retention there).
      - name: Download amd64 digest (develop run)
        if: ${{ needs.release-source.outputs.mode == 'copy' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.target.name }}-amd64
          path: digests
          run-id: ${{ needs.release-source.outputs.run-id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download arm64 digest (develop run)
        if: ${{ needs.release-source.outputs.mode == 'copy' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.target.name }}-arm64
          path: digests
          run-id: ${{ needs.release-source.outputs.run-id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download the verified candidate
        if: ${{ needs.release-source.outputs.mode == 'copy' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: copy-candidate
          path: copy

      - name: Install Trivy
        if: ${{ needs.release-source.outputs.mode == 'copy' }}
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.SETUP_TRIVY_VERSION }}
          cache: true

      - name: Download this run's Trivy DB
        if: ${{ needs.release-source.outputs.mode == 'copy' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trivy-db
          path: ${{ github.workspace }}/.cache/trivy

      - name: Download this run's KEV catalog
        if: ${{ needs.release-source.outputs.mode == 'copy' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kev-catalog
          path: ${{ github.workspace }}/.cache/kev

      - name: Install Cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Install regctl
        run: ./ci/install-regctl.sh

      # A copy: what was downloaded must be exactly what the candidate records for
      # this target (index and platform digests, both architectures, nothing else),
      # then the two per-arch indexes move from php/dev to the staging repository by
      # digest -- the same bytes, with the SBOM and provenance develop's build made --
      # and both platform manifests are scanned again with today's DB, because
      # develop passed them with the DB of its day. A finding fails this leg before
      # anything is attested, listed or tagged. The age limit is checked again here:
      # a failed leg re-run days later reuses the decision, and an image over seven
      # days old is rebuilt (re-run the whole workflow), never copied.
      - name: Copy the tested images from php/dev and scan them again
        if: ${{ needs.release-source.outputs.mode == 'copy' }}
        run: |
          set -euo pipefail
          python3 ci/release_source.py target --candidate copy/release-candidate.json --target "$TARGET_NAME" --digests digests
          refs=()
          for arch in amd64 arm64; do
            index="$(cat "digests/$arch")"
            platform="$(jq -er '.platforms[0].image_digest' "digests/$arch.test-result.json")"
            [[ "$index" =~ ^sha256:[0-9a-f]{64}$ && "$platform" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "FAIL: $arch digests are malformed" >&2; exit 1; }
            ./ci/retry.sh regctl image copy "${DEV_REPO}@${index}" "${STAGE_IMAGE}@${index}"
            got="$(./ci/retry.sh regctl manifest head "${STAGE_IMAGE}@${index}")"
            [ "$got" = "$index" ] || { echo "FAIL: ${STAGE_IMAGE}@${index} resolves to ${got:-nothing} after the copy" >&2; exit 1; }
            echo "ok: $arch index $index copied from $DEV_REPO"
            refs+=("${STAGE_IMAGE}@${platform}")
          done
          ./ci/rescan-image.sh "${refs[@]}"
          printf '%s: copied from develop run %s, rescanned\n' "$TARGET_NAME" "$SOURCE_RUN" >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble multi-arch manifest and verify the full-version tag
        run: |
          set -euo pipefail
          amd64_digest="$(cat digests/amd64)"
          arm64_digest="$(cat digests/arm64)"
          [ -n "$amd64_digest" ] && [ -n "$arm64_digest" ] || {
            echo "FAIL: missing a per-arch digest for $TARGET_NAME" >&2
            exit 1
          }

          # The version tag comes from the built image (PHP_VERSION is
          # arch-invariant), not from matrix.json alone: a published version tag
          # can only claim what the image contains. Pulled explicitly first so a
          # registry 429/5xx is retried; the pull `docker run` does is not.
          ./ci/retry.sh docker pull --quiet "${STAGE_IMAGE}@${amd64_digest}" >/dev/null
          actual_version="$(docker run --rm "${STAGE_IMAGE}@${amd64_digest}" php -r 'echo PHP_VERSION;')"
          [ "$actual_version" = "$TARGET_RELEASE" ] || {
            echo "FAIL: $TARGET_NAME built PHP $actual_version, matrix.json says $TARGET_RELEASE" >&2
            exit 1
          }
          echo "ok: built image reports PHP $actual_version, matches matrix.json"

          full_tag="${TARGET_RELEASE}-${TARGET_FLAVOR}"
          [ "$TARGET_UARCH" = "v3" ] && full_tag="${full_tag}-v3"

          # The same tag names in the staging repository as on Docker Hub; the
          # matrix names them with the Docker Hub repository in front.
          tags=("$full_tag")
          while IFS= read -r t; do
            [ "docker.io/${t%:*}" = "$DOCKERHUB_IMAGE" ] || { echo "FAIL: matrix tag $t is not in $DOCKERHUB_IMAGE" >&2; exit 1; }
            tags+=("${t##*:}")
          done < <(jq -r '.[]' <<<"$TARGET_TAGS")

          # Test results and OpenVEX go onto each platform manifest first, while
          # no tag exists yet: they are addressable from the per-arch index
          # digests in digests/, and ci/attest-image.sh refuses (before attesting
          # anything) an architecture without a passing result, so an untested
          # image never gets a tag. The list gets its own attestations below.
          ./ci/attest-image.sh platforms "$STAGE_IMAGE" "$TARGET_FLAVOR" digests

          # By digest, untagged; the tags go on at the end of the job, once the
          # list is signed and verified. Idempotent (same sources, same
          # annotations, same bytes); its registry calls are retried inside.
          list_digest="$(LIST_RUN_ID="$GITHUB_RUN_ID" LIST_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" LIST_REVISION="$GITHUB_SHA" \
            ./ci/create-list.sh "$STAGE_IMAGE" "$amd64_digest" "$arm64_digest")"
          echo "manifest list digest: $list_digest"
          {
            echo "LIST_DIGEST=$list_digest"
            echo "PROMOTE_TAGS=${tags[*]}"
          } >> "$GITHUB_ENV"

      # --recursive: without it only the index digest gets a signature and the
      # per-platform manifests underneath stay unsigned, which is not what
      # SECURITY.md/README/DOCKERHUB.md promise ("every published digest").
      - name: Sign the manifest, recursively (keyless)
        # Retried on a registry/Rekor/Fulcio 429, 5xx or network error. A repeat can
        # stack a second keyless signature on a digest the first attempt already
        # signed before it failed; a verifier needs any one valid signature, so
        # the duplicate is harmless.
        run: ./ci/retry.sh cosign sign --yes --recursive "${STAGE_IMAGE}@${LIST_DIGEST}"

      # Every signature just made, on the list and on each manifest it holds,
      # verified with the identity above before anything else happens to the
      # list: a signature that would not verify for a user stops the release
      # here, untagged and unrecorded.
      - name: Verify the signatures (keyless identity)
        run: ./ci/verify-signed.sh "$STAGE_IMAGE" "$LIST_DIGEST"

      # The aggregated test results and the OpenVEX statements (vex/php.openvex.json,
      # scoped to the digest) on the manifest list the tags resolve to; the platform
      # manifests got theirs before the list was created. Verified in place with the
      # identity above.
      - name: Attest OpenVEX and test results on the list (keyless)
        run: ./ci/attest-image.sh list "$STAGE_IMAGE" "$LIST_DIGEST" "$TARGET_FLAVOR" digests

      # Only now, with the list signed and every signature and attestation
      # verified, do the staging tags move onto it (byte-exact copies of the
      # list's manifest within the repository, each read back by HEAD).
      - name: Tag the verified list in the staging repository
        run: |
          set -euo pipefail
          read -ra tags <<<"$PROMOTE_TAGS"
          for t in "${tags[@]}"; do
            ./ci/retry.sh regctl image copy "${STAGE_IMAGE}@${LIST_DIGEST}" "${STAGE_IMAGE}:${t}" >/dev/null
            got="$(./ci/retry.sh regctl manifest head "${STAGE_IMAGE}:${t}")"
            [ "$got" = "$LIST_DIGEST" ] || { echo "FAIL: ${STAGE_IMAGE}:${t} resolves to ${got:-nothing}, expected $LIST_DIGEST" >&2; exit 1; }
            echo "ok: ${STAGE_IMAGE}:${t} -> $LIST_DIGEST"
          done

      # Last, so it exists only for a list that is signed and whose signatures
      # and attestations verified: promote copies exactly this digest, and a
      # target without this artifact fails its promote leg instead of
      # publishing anything. It names the run, attempt and commit that made the
      # list (the list carries the same as annotations); promote refuses a
      # record from another run or commit, one whose list does not carry what
      # the record says, and one whose staging tags have since moved on to a
      # list a later attempt made.
      - name: Record the list for promote
        run: |
          set -euo pipefail
          mkdir -p release
          read -ra tags <<<"$PROMOTE_TAGS"
          jq -n --arg list "$LIST_DIGEST" \
            --arg amd64 "$(jq -r '.platforms[0].image_digest' digests/amd64.test-result.json)" \
            --arg arm64 "$(jq -r '.platforms[0].image_digest' digests/arm64.test-result.json)" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" \
            --args '{list: $list, platforms: {amd64: $amd64, arm64: $arm64}, tags: $ARGS.positional,
                     run_id: $run_id, run_attempt: $run_attempt, sha: $sha}' \
            "${tags[@]}" > "release/$TARGET_NAME.json"
          cat "release/$TARGET_NAME.json"

      - name: Upload the list record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target.name }}
          path: release/${{ matrix.target.name }}.json
          if-no-files-found: error
          # A re-run of this leg replaces the earlier attempt's record, so
          # promote never finds an older attempt's record next to a newer list.
          overwrite: true
          # Long enough to re-run a failed promote leg days later -- as long as
          # no later run has moved its tags on (ci/promote-image.sh refuses then).
          retention-days: 7

  # ----------------------------------------------------------------- promote
  # The run's only Docker Hub writes. One leg per target: ci/promote-image.sh
  # copies the list the merge job signed and attested on GHCR to Docker Hub --
  # with every manifest it holds and every signature and attestation of each,
  # same digests (regctl image copy --referrers) -- checks all of it there by
  # HEAD, and only then applies the tags, each copied from GHCR by digest. No
  # GET reaches Docker Hub, so none of it counts against the account's pull
  # limit (tests/test-attest.sh asserts that against a registry that logs).
  #
  # Before it writes anything it refuses: a record from another run or commit,
  # or from an attempt whose staging tags a later attempt has moved on; a list
  # without a signature bundle on it and on every manifest it holds; and moving
  # any Docker Hub tag that a newer (or the same) run's list holds -- so
  # re-running an old run's promote cannot roll `latest` back. A tag held by a
  # digest the staging repository does not know (a tag that predates this
  # pipeline) is refused too, unless the repository variable
  # PROMOTE_ALLOW_UNKNOWN is 1: set it for the first release over such tags, then
  # delete it.
  #
  # With sync-description, the only job in the `release` environment, which is
  # where the Docker Hub secrets are meant to live (an environment secret, with
  # the environment limited to `main`; repository settings, not this file).
  # Those two are the only jobs that reference them. Here they go into a
  # DOCKER_CONFIG created for the promote step and deleted with it.
  # A target whose merge never finished has no release-<target> artifact and
  # fails here. On a re-run attempt an earlier attempt's record can still be
  # there; promote-image.sh then checks it like any other (signed, staging
  # tags still on its list), so it publishes nothing unverified.
  #
  # max-parallel: Docker Hub's write limits are not the pull limit, but 78
  # legs uploading at once is a burst for no gain -- sixteen at a time stays
  # under the org's 20 concurrent jobs and well inside the run's time.
  promote:
    needs: [merge, plan, preflight]
    if: ${{ !cancelled() && needs.merge.result != 'skipped' && needs.preflight.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    name: promote ${{ matrix.target.name }}
    environment: release
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        target: ${{ fromJson(needs.plan.outputs.targets) }}
    runs-on: ubuntu-26.04
    # ci/retry.sh waits 30+60+120+300+600+900 = 2010 s, plus up to 50% jitter,
    # before it gives up on one call: ~34-50 min for a single throttled registry
    # call. Room for three of those (the referrer copy and two tag writes, the
    # ones Docker Hub might throttle) plus the minutes the work itself takes.
    # Past it the job is killed, which fails closed: tags are written last, and
    # a re-run finds the copied digests in place and only moves what is left.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read # GHCR: the staged list and its referrers
    env:
      TARGET_NAME: ${{ matrix.target.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive Docker Hub image from matrix.json
        run: echo "DOCKERHUB_IMAGE=docker.io/$(jq -r .image matrix.json)" >> "$GITHUB_ENV"

      - name: Install regctl
        run: ./ci/install-regctl.sh

      - name: Download the list record
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.target.name }}
          path: release

      - name: Copy the signed list to Docker Hub, then tag it
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTE_ALLOW_UNKNOWN: ${{ vars.PROMOTE_ALLOW_UNKNOWN }}
        run: |
          set -euo pipefail
          record="release/$TARGET_NAME.json"
          # The record must come from this run, this commit, and this or an
          # earlier attempt; promote-image.sh then holds the list's own run
          # annotations to it, and its staging tags to the list.
          jq -e --arg id "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --argjson attempt "$GITHUB_RUN_ATTEMPT" '
            .run_id == $id and .sha == $sha
            and (.run_attempt | test("^[0-9]+$")) and (.run_attempt | tonumber) <= $attempt' "$record" >/dev/null || {
            echo "FAIL: $record is not from run $GITHUB_RUN_ID (attempt <= $GITHUB_RUN_ATTEMPT) at $GITHUB_SHA:" >&2
            cat "$record" >&2
            exit 1
          }
          PROMOTE_RUN_ID="$(jq -r .run_id "$record")"
          PROMOTE_RUN_ATTEMPT="$(jq -r .run_attempt "$record")"
          PROMOTE_REVISION="$(jq -r .sha "$record")"
          export PROMOTE_RUN_ID PROMOTE_RUN_ATTEMPT PROMOTE_REVISION
          export DOCKER_CONFIG="$RUNNER_TEMP/promote-docker-config"
          rm -rf "$DOCKER_CONFIG"
          mkdir -m 700 "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          mapfile -t tags < <(jq -r '.tags[]' "$record")
          ./ci/promote-image.sh "$STAGE_IMAGE" "$(jq -r .list "$record")" "$DOCKERHUB_IMAGE" "${tags[@]}"

  # -------------------------------------------------------------- hub-verify
  # The list `latest` points at, verified on Docker Hub the way SECURITY.md tells
  # users to: anonymously, with cosign, against the workflow identity
  # (ci/hub-verify.sh). promote already proved by digest that every list's
  # signatures and attestations are there; this proves cosign finds and accepts
  # them there, for a handful of anonymous reads instead of hundreds.
  hub-verify:
    needs: [promote, plan]
    if: ${{ !cancelled() && needs.promote.result != 'skipped' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TARGETS: ${{ needs.plan.outputs.targets }}
      # Exactly the identity the merge job verifies against and SECURITY.md documents.
      COSIGN_VERIFY_FLAGS: >-
        --certificate-oidc-issuer https://token.actions.githubusercontent.com
        --certificate-identity https://github.com/LotusWebAgency/php/.github/workflows/ci.yml@refs/heads/main
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pick the list `latest` points at
        run: |
          set -euo pipefail
          image="$(jq -r .image matrix.json)"
          name="$(jq -r --arg latest "$image:latest" '[.[] | select(.tags | index($latest))][0].name // empty' <<<"$TARGETS")"
          [ -n "$name" ] || { echo "FAIL: no target is tagged $image:latest" >&2; exit 1; }
          {
            echo "DOCKERHUB_IMAGE=docker.io/$image"
            echo "CANARY=$name"
          } >> "$GITHUB_ENV"

      - name: Download its list record
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.CANARY }}
          path: release

      - name: Install Cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Install regctl
        run: ./ci/install-regctl.sh

      - name: Verify on Docker Hub, anonymously
        run: ./ci/hub-verify.sh "$DOCKERHUB_IMAGE" "release/$CANARY.json"

  # ------------------------------------------------------------ sync-description
  # Pushes DOCKERHUB.md to the Docker Hub page after a successful publish. An
  # API call with the account token, not a registry read.
  sync-description:
    needs: promote
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive Docker Hub repository from matrix.json
        run: echo "DOCKERHUB_REPO=$(jq -r .image matrix.json)" >> "$GITHUB_ENV"

      - name: Sync Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_REPO }}
          short-description: "PHP 7.0-8.5 built from source with PGO, hardened, on Wolfi"
          readme-filepath: ./DOCKERHUB.md
