# Build -> test -> scan -> publish for lotuswebagency/php: a docker-bake matrix of
# 50 targets (11 PHP versions x 4 flavors, plus an x86-64-v3 / armv9-a variant
# of fpm/cli/cli-builder on 8.4 and 8.5), each built with a PGO training corpus
# that is itself a build input.
#
# Three modes, chosen by the event and the ref:
#
#   pull request (to main or develop)  `verify` builds, tests and Trivy-gates a
#     small subset on amd64 without publishing. The aggregate `pr-gate` is the one
#     required check, so a PHP version bump that renames per-leg check names cannot
#     silently stop branch protection from covering anything.
#   push or dispatch on develop  `verify` over the whole matrix, natively on amd64
#     and arm64 (no QEMU): build --load, smoke, the ext-builder end-to-end test,
#     Trivy. Every image that passed is pushed to GHCR as
#     ghcr.io/lotuswebagency/php/dev:<tag>-<sha>-<arch> for further testing;
#     `dev-manifest` joins the arches into dev:<tag>-<sha> and, when every verify
#     leg succeeded, moves the floating dev:<tag>. These are unpublished test
#     builds, pruned by dev-prune.yml. Nothing reaches Docker Hub: no job here
#     logs in to it, holds the `release` environment or sets a push output on a
#     bake build. The PGO corpus is built and published to GHCR; the build cache
#     is read from GHCR but only `build` writes it.
#   push or dispatch on main, and the weekly cron (default branch only)  `build`
#     pushes every image by digest, with SBOM + max-mode provenance, to the GHCR
#     staging repository ghcr.io/lotuswebagency/php/release and tests that digest.
#     `merge` assembles the multi-arch lists, signs every manifest keylessly with
#     cosign and attaches keyless attestations: the test results `build` recorded
#     after smoke and Trivy passed, and the OpenVEX statements from
#     vex/php.openvex.json where one applies to the flavor. `promote` copies each
#     signed list to Docker Hub with its signatures and attestations, same
#     digests, and tags it there only after that. `hub-verify` checks one promoted
#     list anonymously, the way SECURITY.md tells users to; `sync-description`
#     updates the Docker Hub page. `promote` and `sync-description` are the only
#     jobs that reference the Docker Hub secrets and the only ones in the
#     `release` environment. The secrets are meant to be environment secrets of
#     `release`, with that environment limited to `main`: a repository setting
#     this file cannot enforce.
#
# ext-builder is not a leg of its own: it is built in the same bake invocation as
# its version's cli target (scripts/gen_matrix.py's build legs), so the php-build
# stage (PHP compile plus the PGO passes) is shared. Its image is still tested,
# pushed by its own digest, merged and signed separately.
#
# Every third-party action is pinned to a full commit SHA with a version comment;
# mutable tags have been hijacked before (GHSA-69fq-xp46-6x23). regctl, the one
# tool fetched outside an action, is pinned by version and sha256 in
# ci/install-regctl.sh, and the BuildKit image by digest (env below).
#
# PGO corpus: each of the 7 tiers (scripts/pgo_tiers.py) is architecture-specific
# (php/pgo/Dockerfile.corpus installs mariadb and inherits the whole cli-builder
# toolchain), so `corpus` builds each {tier, arch} natively and `corpus-merge`
# assembles the two per-arch images into one multi-platform index per tier. It is
# published as the floating `php<tier>` ref that every target's `corpus` context
# names and as `php<tier>-<inputs-hash>`. A `docker-image://` context resolves a
# multi-platform index to the building target's own platform, so one ref serves
# both the amd64 and the arm64 legs. Every verify/build leg mounts the hash-pinned
# ref and asserts the pulled image's inputs-hash label: the floating tag can point
# at a corpus another tree trained (after a revert, for instance).
#
# Docker Hub access: authenticated reads drained the publishing account's pull
# limit and cost legs to 429s, so:
#   - Only `promote` and `sync-description` use Docker Hub credentials, and
#     `promote` only writes and HEADs (Docker Hub does not count a HEAD as a
#     pull) in a DOCKER_CONFIG made for that one step, after every read of the
#     run is done.
#   - Our own images are staged, tested, signed, attested and verified on GHCR
#     (ghcr.io/lotuswebagency/php/release) and never read back from Docker Hub.
#   - Third-party images are read anonymously, digest-pinned, and preferably not
#     from Docker Hub: BuildKit resolves docker.io through mirror.gcr.io, then
#     public.ecr.aws/docker (Docker's official images), then Docker Hub itself
#     (buildkitd-config-inline below); jobs that pull through the runner's own
#     daemon get mirror.gcr.io as its registry mirror (ci/hub-mirror.sh); the
#     BuildKit image comes from mirror.gcr.io. The Dockerfile frontend named in
#     each `# syntax=` line is pinned by its multi-arch index digest as well
#     (Renovate's dockerfile manager keeps it current). A pinned digest means no
#     source can change what is pulled.
#   - The run's only Docker Hub reads are hub-verify's few anonymous ones.
# Registry calls that can still meet a 429/5xx run under ci/retry.sh, which
# retries only 429/5xx/network errors with backoff.
name: ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Weekly rebuild: fresh base layers and Debian package updates. The bake
    # cache ref includes an ISO-week component (docker-bake.hcl's CACHE_WEEK)
    # so this run always starts the runtime-package layer's cache scope
    # empty instead of replaying last week's apt-get install forever.
    - cron: "10 4 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR and develop runs are canceled (the org's runners are scarce
  # and a develop push only produces GHCR test images, never a release); a main
  # run, which publishes, is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}

# Deny-by-default; every job below grants back only what its own steps need
# (id-token: write only for the cosign job, packages: write only for the jobs
# that push to GHCR).
permissions: {}

env:
  GHCR_CORPUS_REGISTRY: ghcr.io/lotuswebagency/php
  # main's images between build and promotion: pushed by digest, tested, merged,
  # signed and attested here; promote copies them to Docker Hub. Its tags follow
  # the Docker Hub ones from the merge job on (see merge).
  STAGE_IMAGE: ghcr.io/lotuswebagency/php/release
  # The image of every docker-container BuildKit builder (setup-buildx-action's
  # default is moby/buildkit:buildx-stable-1 from Docker Hub, unpinned); also read
  # by tests/test-attest.sh.
  BUILDKIT_IMAGE: mirror.gcr.io/moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

jobs:
  # ------------------------------------------------------------- preflight
  # Everything tests/preflight.sh already checks without building an image:
  # matrix.gen.hcl drift, PGO tier coverage, bake --print + COMPILER
  # cross-check, shellcheck, the python unit suite, build-all.sh/bake target
  # list drift. Runs on every push and PR -- cheap, and it is what catches a
  # stale generated file or a shellcheck regression in seconds rather than
  # forty minutes into a from-source PGO build.
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # tests/test-attest.sh pulls its registry images through the daemon.
      - name: Route Docker Hub pulls through mirror.gcr.io
        run: ./ci/hub-mirror.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Ensure shellcheck is present
        run: command -v shellcheck >/dev/null || (sudo apt-get update && sudo apt-get install -y shellcheck)

      - name: tests/preflight.sh
        run: ./tests/preflight.sh

      # Not a gate: the Trivy step is what fails on an expired accepted risk.
      # This only puts the date in front of people two weeks ahead.
      - name: VEX review deadlines
        run: python3 ci/vex.py check --warn-within 14

      # tests/test-attest.sh: the publish-time attestation and promotion scripts
      # against two throwaway registries (GHCR-like and Docker Hub-like) and a
      # local key, in the merge and promote jobs' order.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install regctl
        run: ./ci/install-regctl.sh

      - name: tests/test-attest.sh
        run: ./tests/test-attest.sh

  # ----------------------------------------------------------- verify-matrix
  # What the verify job below builds, and on which architectures. A pull
  # request gets the bake `pr` subset (php-7_0-fpm, php-8_2-fpm, php-8_5-fpm,
  # php-8_5-cli-builder and php-8_5-cli, which carries ext-builder -- oldest and
  # newest ends, one mid-range version, the heaviest flavor and the extension
  # build stage) on amd64 only; develop gets every build leg on amd64 and arm64.
  # Both lists come from scripts/gen_matrix.py, the source tests/preflight.sh's
  # bake --print cross-check trusts.
  verify-matrix:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      legs: ${{ steps.matrix.outputs.legs }}
      arches: ${{ steps.matrix.outputs.arches }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: matrix
        run: |
          set -euo pipefail
          amd64='{"name":"amd64","runner":"ubuntu-24.04","platform":"linux/amd64"}'
          arm64='{"name":"arm64","runner":"ubuntu-24.04-arm","platform":"linux/arm64"}'
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "legs=$(python3 scripts/gen_matrix.py --github pr | jq -c '.include')" >> "$GITHUB_OUTPUT"
            echo "arches=[$amd64]" >> "$GITHUB_OUTPUT"
          else
            echo "legs=$(python3 scripts/gen_matrix.py --github build | jq -c '.include')" >> "$GITHUB_OUTPUT"
            echo "arches=[$amd64,$arm64]" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------ verify
  # Build the leg's bake targets for this architecture with --load, smoke.sh
  # each image, the ext-builder end-to-end test where the leg carries it, and
  # the Trivy gate on the loaded images. On develop, once all of that passed,
  # the tested images are pushed to ghcr.io/lotuswebagency/php/dev under
  # per-arch tags (the last step; dev-manifest below joins them). Never reaches
  # Docker Hub: no Docker Hub login, no `release` environment, and no PUSH
  # variable, so the bake build itself has no output a registry could receive --
  # the dev push is a plain `docker push` of the image that was just tested.
  # This is the whole of what runs for a pull request and for develop; main's
  # publishing counterpart is the `build` job below.
  #
  # Mounts each target's tier corpus by its hash-pinned GHCR ref and asserts the
  # pulled image's inputs-hash label matches, never the floating ref (see the
  # header). A PR that changes the PGO corpus itself is not re-trained by its own
  # gate (the corpus job runs only on develop and main), so it is graded against
  # the last published corpus for its tier; a develop push has its corpus built by
  # the corpus jobs first.
  #
  # `!cancelled()` plus explicit result checks instead of the implicit success
  # gate: corpus-merge is skipped on a pull request, and one failed corpus tier
  # on develop must only fail the legs that mount it, not skip every other leg
  # (same reasoning as `build`'s condition).
  verify:
    needs: [preflight, verify-matrix, corpus-merge]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.verify-matrix.result == 'success' }}
    name: verify ${{ matrix.target.name }} ${{ matrix.arch.name }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.verify-matrix.outputs.legs) }}
        arch: ${{ fromJson(needs.verify-matrix.outputs.arches) }}
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      # GHCR: pull of the PGO corpus image and the build cache, and, on a develop
      # push only, the dev image push. A pull request never reaches the push
      # step (and a fork's token is read-only whatever is asked for here).
      packages: write
    env:
      TARGET_NAME: ${{ matrix.target.name }}
      TARGET_BAKE: ${{ matrix.target.bake }}
      TARGET_TAG: ${{ matrix.target.tags[0] }}
      TARGET_PHP: ${{ matrix.target.php }}
      TARGET_FLAVOR: ${{ matrix.target.flavor }}
      TARGET_CORPUS: ${{ matrix.target.corpus }}
      RIDER_NAME: ${{ matrix.target.rider_name }}
      RIDER_TAG: ${{ matrix.target.rider_tag }}
      RIDER_FLAVOR: ${{ matrix.target.rider_flavor }}
      PLATFORM: ${{ matrix.arch.platform }}
      ARCH: ${{ matrix.arch.name }}
      # Develop reads main's build cache and never writes it (CACHE_PUSH=false
      # drops cache-to in docker-bake.hcl); a pull request uses no cache.
      CACHE_REGISTRY: ${{ github.event_name != 'pull_request' && 'ghcr.io/lotuswebagency/php' || '' }}
      CACHE_PUSH: "false"
      # Only the org.opencontainers.image.revision label (and the dev tag's sha).
      REVISION: ${{ github.sha }}
      DEV_REPO: ghcr.io/lotuswebagency/php/dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
          # Base images resolve through mirror.gcr.io, then public.ecr.aws's copy
          # of Docker's official images (BuildKit takes a mirror with a path),
          # then Docker Hub itself -- anonymously in every case: no job that
          # builds holds Docker Hub credentials. Every FROM is digest-pinned, so
          # no source can change what is built: BuildKit checks the digest it
          # gets. Pushes go to GHCR, never to a mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io", "public.ecr.aws/docker"]

      - name: Log in to GHCR (corpus and cache pull, dev image push)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute inputs hash
        run: |
          {
            echo "INPUTS_HASH=$(./scripts/inputs-hash.sh)"
            echo "CACHE_WEEK=$(date -u +%G-W%V)"
          } >> "$GITHUB_ENV"

      - name: Pull and verify this target's hash-pinned PGO corpus
        run: |
          set -euo pipefail
          corpus_ref="${TARGET_CORPUS}-${INPUTS_HASH}"
          docker pull "$corpus_ref"
          label_hash="$(docker inspect --format '{{index .Config.Labels "com.lotuswebagency.inputs-hash"}}' "$corpus_ref")"
          [ "$label_hash" = "$INPUTS_HASH" ] || {
            echo "FAIL: $corpus_ref carries inputs-hash '$label_hash', expected '$INPUTS_HASH'" >&2
            exit 1
          }
          echo "ok: $corpus_ref inputs-hash matches this tree"
          # test-pgo.sh (via smoke.sh) reads the tier's MANIFEST by its floating
          # tag; point that tag at the corpus just verified, never a pulled one.
          docker tag "$corpus_ref" "$TARGET_CORPUS"
          echo "CORPUS_REF=$corpus_ref" >> "$GITHUB_ENV"

      # One invocation for the whole leg (the target, plus ext-builder when it
      # rides along): BuildKit builds the shared php-build stage once, and
      # `*.contexts.corpus` hands every target in it the same hash-pinned corpus
      # -- a target left on the floating ref would be a second php-build.
      - name: Build (load) for test
        run: |
          set -euo pipefail
          read -ra bake_targets <<<"$TARGET_BAKE"
          # Retried on a Docker Hub 429/5xx/network error (ci/retry.sh); the second
          # attempt is mostly layer-cache hits. Five attempts (30s to 5min waits);
          # a build that fails for real is never retried, only a registry error.
          RETRY_ATTEMPTS=5 ./ci/retry.sh docker buildx bake -f matrix.gen.hcl -f docker-bake.hcl "${bake_targets[@]}" \
            --set "*.platform=$PLATFORM" \
            --set "*.contexts.corpus=docker-image://$CORPUS_REF" \
            --load

      - name: Smoke test
        run: ./tests/smoke.sh "$TARGET_TAG" "$TARGET_PHP" "$TARGET_FLAVOR"

      - name: Smoke test (ext-builder, built with this leg)
        if: matrix.target.rider_name != ''
        run: ./tests/smoke.sh "$RIDER_TAG" "$TARGET_PHP" "$RIDER_FLAVOR"

      # The cross-image half of the ext-builder tests: an extension compiled in
      # ext-builder, COPYed into fpm and cli of the same version, loaded and
      # called. Needs all three images; this leg has cli and ext-builder, so it
      # builds the fpm sibling too -- same builder, same corpus context, so the
      # php-build stage it just compiled is a layer-cache hit and only the thin
      # fpm stage is new work.
      - name: Build the fpm sibling, test an extension end to end (ext-builder)
        if: matrix.target.rider_flavor == 'ext-builder'
        run: |
          set -euo pipefail
          slug="php-${TARGET_PHP//./_}"
          RETRY_ATTEMPTS=5 ./ci/retry.sh docker buildx bake -f matrix.gen.hcl -f docker-bake.hcl "$slug-fpm" \
            --set "*.platform=$PLATFORM" \
            --set "*.contexts.corpus=docker-image://$CORPUS_REF" \
            --load
          ./tests/test-ext-builder.sh "$TARGET_PHP"

      # A repo-root .trivyignore, if present, is honored automatically.
      - name: Trivy vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.TARGET_TAG }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy vulnerability gate (ext-builder)
        if: matrix.target.rider_name != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.RIDER_TAG }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # Only reached when the smoke tests and both Trivy gates above passed, so
      # a pushed image is a tested one. Per-arch tag <tag>-<sha>-<arch>; the
      # fpm sibling built for test-ext-builder.sh is not pushed (the fpm leg
      # pushes its own), the ext-builder that rides on a cli leg is.
      - name: Push the tested image to GHCR (develop)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA::12}"
          for local_tag in "$TARGET_TAG" ${RIDER_TAG:+"$RIDER_TAG"}; do
            dest="${DEV_REPO}:${local_tag#*:}-${sha}-${ARCH}"
            docker tag "$local_tag" "$dest"
            ./ci/retry.sh docker push "$dest"
            echo "ok: pushed $dest"
          done

  # ------------------------------------------------------------- dev-manifest
  # develop only. Joins the per-arch dev images the verify legs pushed into one
  # manifest list per target, dev:<tag>-<sha> (both arches present), and moves
  # the floating dev:<tag> onto it only when every verify leg of this run
  # succeeded and the run's commit is still the head of develop, so the floating
  # set mixes commits at most inside the short second pass of the script (a
  # cancel or crash there can split it; the prune keeps both sha sets). One job
  # over all 50 targets, not a matrix: each target is a handful of manifest calls
  # and runners are scarce. A missing arch while verify claims success is a bug
  # and fails the job; after a failed verify leg the missing ones are only
  # reported. The logic is in ci/dev-manifest.sh.
  dev-manifest:
    needs: [verify]
    if: ${{ !cancelled() && needs.verify.result != 'skipped' && github.ref == 'refs/heads/develop' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # GHCR: the dev manifest lists and floating tags
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the dev manifest lists and move the floating tags
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: ./ci/dev-manifest.sh

  # ----------------------------------------------------------------- pr-gate
  # One aggregate required check instead of branch protection naming every verify
  # matrix leg by hand: GitHub's per-leg check names include the matrix values
  # (php version, flavor...), so a version bump renames them and silently drops
  # coverage from a rule that names the old ones. pr-gate is the only check to
  # require (together with preflight, which it also depends on) and it fails
  # unless every leg that ran actually succeeded.
  pr-gate:
    needs: [preflight, verify]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require preflight and every verify leg to have succeeded
        run: |
          echo "preflight: ${{ needs.preflight.result }}"
          echo "verify:    ${{ needs.verify.result }}"
          [ "${{ needs.preflight.result }}" = "success" ] || { echo "FAIL: preflight did not succeed" >&2; exit 1; }
          [ "${{ needs.verify.result }}" = "success" ] || { echo "FAIL: at least one verify leg did not succeed" >&2; exit 1; }
          echo "ok: preflight and every verify leg succeeded"

  # -------------------------------------------------------- release-matrix
  # The full 50-target matrix (scripts/gen_matrix.py --github targets) for the
  # merge job, and the 39 build legs of it (--github build: ext-builder rides
  # with its version's cli leg) for the build job. main only: develop's
  # counterpart is verify-matrix.
  release-matrix:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
      legs: ${{ steps.matrix.outputs.legs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Not a gate (see preflight): a warning on every push to main and cron run
      # within 14 days of a VEX review-by date.
      - name: VEX review deadlines
        run: python3 ci/vex.py check --warn-within 14

      - id: matrix
        run: |
          echo "targets=$(python3 scripts/gen_matrix.py --github targets | jq -c '.include')" >> "$GITHUB_OUTPUT"
          echo "legs=$(python3 scripts/gen_matrix.py --github build | jq -c '.include')" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------ corpus-matrix
  # The 7 corpus tiers (scripts/pgo_tiers.py list) as a matrix for the corpus and
  # corpus-merge jobs, from the same source every other corpus-aware script reads.
  corpus-matrix:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tiers: ${{ steps.matrix.outputs.tiers }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: matrix
        run: |
          tiers="$(python3 scripts/pgo_tiers.py list | jq -R -s -c '
            split("\n") | map(select(length > 0) | split("\t")) |
            map({floor: .[0], builder: .[2], tag: .[3]})
          ')"
          echo "tiers=$tiers" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ corpus
  # One PGO corpus image per {tier, arch} (7 tiers x 2 arches = 14 legs), rebuilt
  # only when a tier's inputs change and published to GHCR under a per-arch,
  # hash-suffixed tag. corpus-merge assembles the two arches of each tier into one
  # multi-platform index. Runs before `build`, since every php target mounts its
  # tier's corpus. Runs on develop as well as main: the corpus is a GHCR image,
  # and develop's verify legs mount it by its hash-pinned ref like main's build
  # legs do.
  #
  # One job per tier and arch rather than one job building all 7 tiers in a row:
  # that would be 7 bootstrap PHP compiles plus 7 application corpus builds on a
  # single runner, past any sensible timeout whenever a shared input changes.
  corpus:
    needs: [preflight, corpus-matrix]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    name: corpus ${{ matrix.tier.floor }} ${{ matrix.arch.name }}
    strategy:
      fail-fast: false
      matrix:
        tier: ${{ fromJson(needs.corpus-matrix.outputs.tiers) }}
        arch:
          - name: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - name: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      TIER: ${{ matrix.tier.floor }}
      TIER_BUILDER: ${{ matrix.tier.builder }}
      TIER_TAG: ${{ matrix.tier.tag }}
      ARCH_NAME: ${{ matrix.arch.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job builds through the runner's own daemon (the `docker` driver
      # below, and plain `docker build`), which does not see the BuildKit mirror
      # setting of the build/verify jobs: the daemon's registry-mirrors does.
      # Every Docker Hub base is digest-pinned, so the mirror cannot change what
      # is built, and the daemon falls back to Docker Hub, anonymously.
      - name: Route Docker Hub pulls through mirror.gcr.io
        run: ./ci/hub-mirror.sh

      # The docker driver, not the action's default docker-container:
      # Dockerfile.corpus and the bootstrap cli-builder Dockerfile FROM images
      # that may exist only in this runner's local daemon store (a just-loaded
      # bootstrap image, or the tier's previous corpus build). The isolated
      # BuildKit container of the docker-container driver cannot see that store
      # and fails with "pull access denied". The other jobs only reference pushed
      # registry refs, which docker-container pulls itself.
      - name: Set up Docker Buildx (docker driver -- FROM/inspect need the local image store)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute inputs hash
        run: echo "INPUTS_HASH=$(./scripts/inputs-hash.sh)" >> "$GITHUB_ENV"

      - name: Reuse this tier+arch's corpus from GHCR if unchanged
        id: reuse
        run: |
          set -euo pipefail
          per_arch_ref="${TIER_TAG}-${INPUTS_HASH}-${ARCH_NAME}"
          if docker manifest inspect "$per_arch_ref" >/dev/null 2>&1; then
            echo "ok: tier $TIER/$ARCH_NAME unchanged -- $per_arch_ref already in GHCR"
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
            # Best effort: when this tier's release cli-builder is already
            # published, build-corpus.sh finds it instead of bootstrapping.
            # The GHCR staging copy first (main's merge job tags it there),
            # Docker Hub anonymously through the mirror when it is not there.
            # Transient registry errors are retried, since a 429 would send the
            # leg into the slow bootstrap; "not found" falls through.
            staged="${STAGE_IMAGE}:${TIER_BUILDER#*:}"
            if ./ci/retry.sh docker pull --quiet "$staged" >/dev/null 2>&1; then
              docker tag "$staged" "$TIER_BUILDER"
              echo "note: pulled release builder $staged as $TIER_BUILDER"
            elif ./ci/retry.sh docker pull --quiet "$TIER_BUILDER" >/dev/null 2>&1; then
              echo "note: pulled published release builder $TIER_BUILDER"
            else
              echo "note: $TIER_BUILDER not available yet, build-corpus.sh will bootstrap"
            fi
          fi

      - name: Build this tier's corpus (skipped if reused)
        if: steps.reuse.outputs.reused != 'true'
        run: ./tests/build-corpus.sh "$TIER"

      - name: Publish this tier+arch's corpus (skipped if reused)
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          label_hash="$(docker inspect --format '{{index .Config.Labels "com.lotuswebagency.inputs-hash"}}' "$TIER_TAG" 2>/dev/null || true)"
          [ "$label_hash" = "$INPUTS_HASH" ] || {
            echo "FAIL: $TIER_TAG missing or stale after build-corpus.sh (label=$label_hash, want $INPUTS_HASH)" >&2
            exit 1
          }
          per_arch_ref="${TIER_TAG}-${INPUTS_HASH}-${ARCH_NAME}"
          docker tag "$TIER_TAG" "$per_arch_ref"
          ./ci/retry.sh docker push "$per_arch_ref"
          echo "ok: pushed $per_arch_ref"

  # ------------------------------------------------------------ corpus-merge
  # One multi-platform index per tier, assembled from the two per-arch,
  # hash-suffixed images the corpus job publishes, under both the floating
  # `php<tier>` ref (what every target's `contexts.corpus` names) and
  # `php<tier>-<inputs-hash>` (what build/verify actually mount).
  corpus-merge:
    needs: [corpus, corpus-matrix]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
    name: corpus-merge ${{ matrix.tier.floor }}
    strategy:
      fail-fast: false
      matrix:
        tier: ${{ fromJson(needs.corpus-matrix.outputs.tiers) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      TIER_TAG: ${{ matrix.tier.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute inputs hash
        run: echo "INPUTS_HASH=$(./scripts/inputs-hash.sh)" >> "$GITHUB_ENV"

      - name: Assemble this tier's multi-platform corpus index
        run: |
          set -euo pipefail
          hash_tag="${TIER_TAG}-${INPUTS_HASH}"
          amd64_ref="${hash_tag}-amd64"
          arm64_ref="${hash_tag}-arm64"
          for ref in "$amd64_ref" "$arm64_ref"; do
            docker manifest inspect "$ref" >/dev/null 2>&1 || {
              echo "FAIL: missing $ref -- its corpus leg did not succeed" >&2
              exit 1
            }
          done
          if docker manifest inspect "$hash_tag" >/dev/null 2>&1; then
            echo "ok: $hash_tag already published, nothing to assemble"
          else
            docker buildx imagetools create -t "$TIER_TAG" -t "$hash_tag" "$amd64_ref" "$arm64_ref"
            echo "ok: published $TIER_TAG and $hash_tag as a multi-platform index"
          fi

  # ------------------------------------------------------------------- build
  # Every build leg x {amd64 on ubuntu-24.04, arm64 on ubuntu-24.04-arm}, native,
  # no QEMU. A leg is one bake invocation: a target, plus ext-builder when the
  # target is its version's cli (see the header), whose image is pushed by its own
  # digest, tested, scanned and uploaded like any other.
  # Build and push by digest (no tag) to the GHCR staging repository, then pull
  # that exact digest back and smoke/Trivy-test it: what gets scanned, merged and
  # promoted is byte-for-byte what was pushed, never a separately built --load
  # copy that could drift if a base layer refreshed between two builds. The
  # digest push carries no tag, so nothing is pullable under a real name until
  # the merge job assembles the multi-arch manifest and applies one. No Docker
  # Hub credentials here (no `release` environment, no login): every Docker Hub
  # base image is read anonymously, through the mirrors.
  build:
    needs: [corpus-merge, release-matrix]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.release-matrix.outputs.legs) }}
        arch:
          - name: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - name: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    name: build ${{ matrix.target.name }} ${{ matrix.arch.name }}
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write # GHCR: corpus pull, build-cache push, the staged image push
    env:
      TARGET_NAME: ${{ matrix.target.name }}
      TARGET_BAKE: ${{ matrix.target.bake }}
      TARGET_TAG: ${{ matrix.target.tags[0] }}
      TARGET_PHP: ${{ matrix.target.php }}
      TARGET_FLAVOR: ${{ matrix.target.flavor }}
      TARGET_UARCH: ${{ matrix.target.uarch }}
      TARGET_CORPUS: ${{ matrix.target.corpus }}
      RIDER_NAME: ${{ matrix.target.rider_name }}
      RIDER_FLAVOR: ${{ matrix.target.rider_flavor }}
      PLATFORM: ${{ matrix.arch.platform }}
      ARCH_NAME: ${{ matrix.arch.name }}
      REVISION: ${{ github.sha }}
      CACHE_REGISTRY: ghcr.io/lotuswebagency/php
      # One severity list for the Trivy gate steps and the recorded predicate.
      TRIVY_SEVERITY: CRITICAL,HIGH
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # matrix.json's "image" field is the one source of truth for the Docker Hub
      # repository. Nothing is pushed there from this job: it is the repository
      # the recorded test results name, while the image itself lives in
      # STAGE_IMAGE until promote.
      - name: Derive Docker Hub image from matrix.json
        run: echo "DOCKERHUB_IMAGE=docker.io/$(jq -r .image matrix.json)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
          # Base images resolve through mirror.gcr.io, then public.ecr.aws's copy
          # of Docker's official images (BuildKit takes a mirror with a path),
          # then Docker Hub itself -- anonymously in every case: no job that
          # builds holds Docker Hub credentials. Every FROM is digest-pinned, so
          # no source can change what is built: BuildKit checks the digest it
          # gets. Pushes go to GHCR, never to a mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io", "public.ecr.aws/docker"]

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute inputs hash and build timestamp
        run: |
          {
            echo "INPUTS_HASH=$(./scripts/inputs-hash.sh)"
            echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "CACHE_WEEK=$(date -u +%G-W%V)"
          } >> "$GITHUB_ENV"

      - name: Pull and verify this target's hash-pinned PGO corpus
        run: |
          set -euo pipefail
          corpus_ref="${TARGET_CORPUS}-${INPUTS_HASH}"
          docker pull "$corpus_ref"
          label_hash="$(docker inspect --format '{{index .Config.Labels "com.lotuswebagency.inputs-hash"}}' "$corpus_ref")"
          [ "$label_hash" = "$INPUTS_HASH" ] || {
            echo "FAIL: $corpus_ref carries inputs-hash '$label_hash', expected '$INPUTS_HASH'" >&2
            exit 1
          }
          echo "ok: $corpus_ref inputs-hash matches this tree"
          # test-pgo.sh (via smoke.sh) reads the tier's MANIFEST by its floating
          # tag; point that tag at the corpus just verified, never a pulled one.
          docker tag "$corpus_ref" "$TARGET_CORPUS"
          echo "CORPUS_REF=$corpus_ref" >> "$GITHUB_ENV"

      - name: Build and push by digest to GHCR (SBOM + provenance)
        id: push
        env:
          PUSH: "true"
          ARCH: ${{ matrix.arch.name }}
        run: |
          set -euo pipefail
          read -ra bake_targets <<<"$TARGET_BAKE"
          # Retried on a registry 429/5xx/network error (ci/retry.sh), with a warm
          # layer cache. Safe for a push by digest: every attempt starts by deleting
          # metadata.json, so the digest read below is always the one the attempt
          # that succeeded wrote -- never a leftover of a failed one -- and nothing
          # else carries a digest forward (DIGEST goes to GITHUB_ENV only after
          # this). Whatever a failed attempt pushed stays an untagged, unreferenced
          # orphan in the staging repository.
          RETRY_ATTEMPTS=5 ./ci/retry.sh bash -c 'rm -f metadata.json; exec "$@"' retry-bake \
            docker buildx bake -f matrix.gen.hcl -f docker-bake.hcl "${bake_targets[@]}" \
            --set '*.platform='"$PLATFORM" \
            --set "*.contexts.corpus=docker-image://$CORPUS_REF" \
            --set "*.tags=$STAGE_IMAGE" \
            --set "*.output=type=image,name=$STAGE_IMAGE,push=true,push-by-digest=true,name-canonical=true" \
            --metadata-file metadata.json
          digest="$(jq -r ".[\"$TARGET_NAME\"][\"containerimage.digest\"]" metadata.json)"
          [ -n "$digest" ] && [ "$digest" != "null" ] || {
            echo "FAIL: no containerimage.digest for $TARGET_NAME in metadata.json" >&2
            cat metadata.json >&2
            exit 1
          }
          echo "digest: $digest"
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          mkdir -p /tmp/digests
          echo -n "$digest" > "/tmp/digests/$ARCH_NAME"

          # The ext-builder that rode along: its own digest, in its own
          # directory so the file can still be named exactly amd64/arm64 (what
          # the merge job cats) without colliding with the leg's own.
          if [ -n "$RIDER_NAME" ]; then
            rider_digest="$(jq -r ".[\"$RIDER_NAME\"][\"containerimage.digest\"]" metadata.json)"
            [ -n "$rider_digest" ] && [ "$rider_digest" != "null" ] || {
              echo "FAIL: no containerimage.digest for $RIDER_NAME in metadata.json" >&2
              cat metadata.json >&2
              exit 1
            }
            [ "$rider_digest" != "$digest" ] || {
              echo "FAIL: $RIDER_NAME and $TARGET_NAME resolved to the same digest $digest" >&2
              exit 1
            }
            echo "digest ($RIDER_NAME): $rider_digest"
            echo "RIDER_DIGEST=$rider_digest" >> "$GITHUB_ENV"
            mkdir -p /tmp/digests-rider
            echo -n "$rider_digest" > "/tmp/digests-rider/$ARCH_NAME"
          fi

      - name: Pull the pushed image back by digest
        run: ./ci/retry.sh docker pull --quiet "${STAGE_IMAGE}@${DIGEST}"

      - name: Pull the pushed ext-builder back by digest
        if: matrix.target.rider_name != ''
        run: ./ci/retry.sh docker pull --quiet "${STAGE_IMAGE}@${RIDER_DIGEST}"

      # The output is kept (tee, pipefail) for the signed test-result attestation:
      # ci/result_predicate.py reads the `ok:` lines and refuses a log that
      # does not end in SMOKE PASSED.
      - name: Smoke test the pushed digest
        run: |
          set -euo pipefail
          ./tests/smoke.sh "${STAGE_IMAGE}@${DIGEST}" "$TARGET_PHP" "$TARGET_FLAVOR" 2>&1 | tee "$RUNNER_TEMP/smoke-target.log"

      - name: Smoke test the pushed ext-builder digest
        if: matrix.target.rider_name != ''
        run: |
          set -euo pipefail
          ./tests/smoke.sh "${STAGE_IMAGE}@${RIDER_DIGEST}" "$TARGET_PHP" "$RIDER_FLAVOR" 2>&1 | tee "$RUNNER_TEMP/smoke-rider.log"

      # A repo-root .trivyignore is honored automatically. Scans the exact digest
      # that was pushed and will be merged.
      - name: Trivy vulnerability gate (pushed digest)
        id: trivy_target
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.STAGE_IMAGE }}@${{ env.DIGEST }}
          format: table
          exit-code: "1"
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true

      - name: Trivy vulnerability gate (pushed ext-builder digest)
        id: trivy_rider
        if: matrix.target.rider_name != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.STAGE_IMAGE }}@${{ env.RIDER_DIGEST }}
          format: table
          exit-code: "1"
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true

      # Which scanner and database gave the verdict, for the test-result predicate.
      # Best effort and never a gate: the actions above own the scan; the binary
      # setup-trivy put on PATH and the action's default cache dir are where this
      # looks, and a miss only leaves the two fields out of the predicate.
      - name: Record the Trivy version
        run: |
          trivy --version --format json --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" > "$RUNNER_TEMP/trivy-info.json" \
            || echo '{}' > "$RUNNER_TEMP/trivy-info.json"

      # Reached only when every smoke and Trivy step above passed. Writes the
      # test-result predicate next to the digest file; the merge job attaches it
      # (ci/attest-image.sh) once the manifest list exists. No result file, no
      # attestation: a failed run uploads nothing and the merge job fails.
      # --repository is where the image is published (Docker Hub); the digests
      # are the same there and in the staging repository.
      - name: Record the test results
        env:
          TRIVY_TARGET_OUTCOME: ${{ steps.trivy_target.outcome }}
          TRIVY_RIDER_OUTCOME: ${{ steps.trivy_rider.outcome }}
        run: |
          set -euo pipefail
          record() {  # record <index-digest> <flavor> <smoke-log> <trivy-outcome> <out>
            local platform_digest
            platform_digest="$(./ci/platform-digest.sh "${STAGE_IMAGE}@$1" "$ARCH_NAME")"
            python3 ci/result_predicate.py platform \
              --repository "$DOCKERHUB_IMAGE" --php "$TARGET_PHP" --flavor "$2" --uarch "$TARGET_UARCH" \
              --arch "$ARCH_NAME" --image-digest "$platform_digest" --inputs-hash "$INPUTS_HASH" \
              --git-sha "$GITHUB_SHA" --git-ref "$GITHUB_REF" \
              --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
              --smoke-log "$3" --trivy-outcome "$4" --trivy-severity "$TRIVY_SEVERITY" \
              --trivy-info "$RUNNER_TEMP/trivy-info.json" --out "$5"
          }
          record "$DIGEST" "$TARGET_FLAVOR" "$RUNNER_TEMP/smoke-target.log" "$TRIVY_TARGET_OUTCOME" "/tmp/digests/$ARCH_NAME.test-result.json"
          if [ -n "$RIDER_NAME" ]; then
            record "$RIDER_DIGEST" "$RIDER_FLAVOR" "$RUNNER_TEMP/smoke-rider.log" "$TRIVY_RIDER_OUTCOME" "/tmp/digests-rider/$ARCH_NAME.test-result.json"
          fi

      # The artifact name is the full target name. Several target names share a
      # prefix ("-cli"/"-cli-builder", "-fpm"/"-fpm-v3"), so the merge job must
      # download each artifact by its exact name, never by a prefix pattern.
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.target.name }}-${{ matrix.arch.name }}
          path: |
            /tmp/digests/${{ matrix.arch.name }}
            /tmp/digests/${{ matrix.arch.name }}.test-result.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload ext-builder digest
        if: matrix.target.rider_name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.target.rider_name }}-${{ matrix.arch.name }}
          path: |
            /tmp/digests-rider/${{ matrix.arch.name }}
            /tmp/digests-rider/${{ matrix.arch.name }}.test-result.json
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------------------------- merge
  # One job per target, all of it on GHCR: assemble the two per-arch digests
  # into a multi-arch manifest list in the staging repository, pushed by digest
  # with no tag (ci/create-list.sh), annotated with this run's id, attempt and
  # commit. The full-version tag X.Y.Z-flavor[-v3] is derived from the built
  # image and required to equal matrix.json's release -- a tag can never claim
  # a version the image does not contain. org.opencontainers.image.revision/
  # created are already on every per-arch image from the build job's
  # REVISION/CREATED bake vars. Then cosign-signs the list and every manifest
  # under it (--recursive), verifies every one of those signatures with the
  # documented identity (ci/verify-signed.sh), attests the list and verifies
  # each attestation the same way, and only then tags it in the staging
  # repository (this target's tags from scripts/gen_matrix.py, minus the Docker
  # Hub repository, plus the full-version tag) and records it for promote. No
  # Docker Hub credentials.
  #
  # The staging tags make the GHCR repository track what was last merged (the
  # corpus job takes its release cli-builders from there), and since they are
  # set last, only ever onto a signed and verified list; Docker Hub only gets a
  # tag once promote has copied the signed list there.
  #
  # `if: !cancelled()` instead of the implicit `needs: build` gate: one failed
  # leg must not skip every other target's publish and the weekly security
  # refresh along with it. Each target's own two-digest check below still fails
  # that target's merge leg; fail-fast: false leaves the others unaffected.
  merge:
    needs: [build, release-matrix]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    name: merge ${{ matrix.target.name }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.release-matrix.outputs.targets) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read # checkout, to read matrix.json for the image name
      packages: write # GHCR: the staged list, its tags, signatures and attestations
      id-token: write # cosign keyless OIDC
    env:
      TARGET_NAME: ${{ matrix.target.name }}
      TARGET_PHP: ${{ matrix.target.php }}
      TARGET_RELEASE: ${{ matrix.target.release }}
      TARGET_FLAVOR: ${{ matrix.target.flavor }}
      TARGET_UARCH: ${{ matrix.target.uarch }}
      TARGET_TAGS: ${{ toJson(matrix.target.tags) }}
      # What `cosign verify-attestation` is held to in ci/attest-image.sh: the
      # identity SECURITY.md documents, so a wrong identity fails the release
      # instead of a user.
      COSIGN_VERIFY_FLAGS: >-
        --certificate-oidc-issuer https://token.actions.githubusercontent.com
        --certificate-identity https://github.com/LotusWebAgency/php/.github/workflows/ci.yml@refs/heads/main
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive Docker Hub image from matrix.json
        run: echo "DOCKERHUB_IMAGE=docker.io/$(jq -r .image matrix.json)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Exact artifact names, one download per arch: a `digest-${name}-*` pattern
      # would also match every other target whose name starts with this one's plus
      # a hyphen ("X.Y-cli" matches "X.Y-cli-builder"). The files inside are named
      # exactly "amd64"/"arm64", so both calls can share `path: digests`.
      - name: Download amd64 digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest-${{ matrix.target.name }}-amd64
          path: digests

      - name: Download arm64 digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest-${{ matrix.target.name }}-arm64
          path: digests

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install regctl
        run: ./ci/install-regctl.sh

      - name: Assemble multi-arch manifest and verify the full-version tag
        run: |
          set -euo pipefail
          amd64_digest="$(cat digests/amd64)"
          arm64_digest="$(cat digests/arm64)"
          [ -n "$amd64_digest" ] && [ -n "$arm64_digest" ] || {
            echo "FAIL: missing a per-arch digest for $TARGET_NAME" >&2
            exit 1
          }

          # The version tag comes from the built image (PHP_VERSION is
          # arch-invariant), not from matrix.json alone: a published version tag
          # can only claim what the image contains. Pulled explicitly first so a
          # registry 429/5xx is retried; the pull `docker run` does is not.
          ./ci/retry.sh docker pull --quiet "${STAGE_IMAGE}@${amd64_digest}" >/dev/null
          actual_version="$(docker run --rm "${STAGE_IMAGE}@${amd64_digest}" php -r 'echo PHP_VERSION;')"
          [ "$actual_version" = "$TARGET_RELEASE" ] || {
            echo "FAIL: $TARGET_NAME built PHP $actual_version, matrix.json says $TARGET_RELEASE" >&2
            exit 1
          }
          echo "ok: built image reports PHP $actual_version, matches matrix.json"

          full_tag="${TARGET_RELEASE}-${TARGET_FLAVOR}"
          [ "$TARGET_UARCH" = "v3" ] && full_tag="${full_tag}-v3"

          # The same tag names in the staging repository as on Docker Hub; the
          # matrix names them with the Docker Hub repository in front.
          tags=("$full_tag")
          while IFS= read -r t; do
            [ "docker.io/${t%:*}" = "$DOCKERHUB_IMAGE" ] || { echo "FAIL: matrix tag $t is not in $DOCKERHUB_IMAGE" >&2; exit 1; }
            tags+=("${t##*:}")
          done < <(jq -r '.[]' <<<"$TARGET_TAGS")

          # Test results and OpenVEX go onto each platform manifest first, while
          # no tag exists yet: they are addressable from the per-arch index
          # digests in digests/, and ci/attest-image.sh refuses (before attesting
          # anything) an architecture without a passing result, so an untested
          # image never gets a tag. The list gets its own attestations below.
          ./ci/attest-image.sh platforms "$STAGE_IMAGE" "$TARGET_FLAVOR" digests

          # By digest, untagged; the tags go on at the end of the job, once the
          # list is signed and verified. Idempotent (same sources, same
          # annotations, same bytes); its registry calls are retried inside.
          list_digest="$(LIST_RUN_ID="$GITHUB_RUN_ID" LIST_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" LIST_REVISION="$GITHUB_SHA" \
            ./ci/create-list.sh "$STAGE_IMAGE" "$amd64_digest" "$arm64_digest")"
          echo "manifest list digest: $list_digest"
          {
            echo "LIST_DIGEST=$list_digest"
            echo "PROMOTE_TAGS=${tags[*]}"
          } >> "$GITHUB_ENV"

      # --recursive: without it only the index digest gets a signature and the
      # per-platform manifests underneath stay unsigned, which is not what
      # SECURITY.md/README/DOCKERHUB.md promise ("every published digest").
      - name: Sign the manifest, recursively (keyless)
        # Retried on a registry/Rekor/Fulcio 429, 5xx or network error. A repeat can
        # stack a second keyless signature on a digest the first attempt already
        # signed before it failed; a verifier needs any one valid signature, so
        # the duplicate is harmless.
        run: ./ci/retry.sh cosign sign --yes --recursive "${STAGE_IMAGE}@${LIST_DIGEST}"

      # Every signature just made, on the list and on each manifest it holds,
      # verified with the identity above before anything else happens to the
      # list: a signature that would not verify for a user stops the release
      # here, untagged and unrecorded.
      - name: Verify the signatures (keyless identity)
        run: ./ci/verify-signed.sh "$STAGE_IMAGE" "$LIST_DIGEST"

      # The aggregated test results and the OpenVEX statements (vex/php.openvex.json,
      # scoped to the digest) on the manifest list the tags resolve to; the platform
      # manifests got theirs before the list was created. Verified in place with the
      # identity above.
      - name: Attest OpenVEX and test results on the list (keyless)
        run: ./ci/attest-image.sh list "$STAGE_IMAGE" "$LIST_DIGEST" "$TARGET_FLAVOR" digests

      # Only now, with the list signed and every signature and attestation
      # verified, do the staging tags move onto it (byte-exact copies of the
      # list's manifest within the repository, each read back by HEAD).
      - name: Tag the verified list in the staging repository
        run: |
          set -euo pipefail
          read -ra tags <<<"$PROMOTE_TAGS"
          for t in "${tags[@]}"; do
            ./ci/retry.sh regctl image copy "${STAGE_IMAGE}@${LIST_DIGEST}" "${STAGE_IMAGE}:${t}" >/dev/null
            got="$(./ci/retry.sh regctl manifest head "${STAGE_IMAGE}:${t}")"
            [ "$got" = "$LIST_DIGEST" ] || { echo "FAIL: ${STAGE_IMAGE}:${t} resolves to ${got:-nothing}, expected $LIST_DIGEST" >&2; exit 1; }
            echo "ok: ${STAGE_IMAGE}:${t} -> $LIST_DIGEST"
          done

      # Last, so it exists only for a list that is signed and whose signatures
      # and attestations verified: promote copies exactly this digest, and a
      # target without this artifact fails its promote leg instead of
      # publishing anything. It names the run, attempt and commit that made the
      # list (the list carries the same as annotations); promote refuses a
      # record from another run or commit, one whose list does not carry what
      # the record says, and one whose staging tags have since moved on to a
      # list a later attempt made.
      - name: Record the list for promote
        run: |
          set -euo pipefail
          mkdir -p release
          read -ra tags <<<"$PROMOTE_TAGS"
          jq -n --arg list "$LIST_DIGEST" \
            --arg amd64 "$(jq -r '.platforms[0].image_digest' digests/amd64.test-result.json)" \
            --arg arm64 "$(jq -r '.platforms[0].image_digest' digests/arm64.test-result.json)" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" \
            --args '{list: $list, platforms: {amd64: $amd64, arm64: $arm64}, tags: $ARGS.positional,
                     run_id: $run_id, run_attempt: $run_attempt, sha: $sha}' \
            "${tags[@]}" > "release/$TARGET_NAME.json"
          cat "release/$TARGET_NAME.json"

      - name: Upload the list record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target.name }}
          path: release/${{ matrix.target.name }}.json
          if-no-files-found: error
          # A re-run of this leg replaces the earlier attempt's record, so
          # promote never finds an older attempt's record next to a newer list.
          overwrite: true
          # Long enough to re-run a failed promote leg days later -- as long as
          # no later run has moved its tags on (ci/promote-image.sh refuses then).
          retention-days: 7

  # ----------------------------------------------------------------- promote
  # The run's only Docker Hub writes. One leg per target: ci/promote-image.sh
  # copies the list the merge job signed and attested on GHCR to Docker Hub --
  # with every manifest it holds and every signature and attestation of each,
  # same digests (regctl image copy --referrers) -- checks all of it there by
  # HEAD, and only then applies the tags, each copied from GHCR by digest. No
  # GET reaches Docker Hub, so none of it counts against the account's pull
  # limit (tests/test-attest.sh asserts that against a registry that logs).
  #
  # Before it writes anything it refuses: a record from another run or commit,
  # or from an attempt whose staging tags a later attempt has moved on; a list
  # without a signature bundle on it and on every manifest it holds; and moving
  # any Docker Hub tag that a newer (or the same) run's list holds -- so
  # re-running an old run's promote cannot roll `latest` back. A tag held by a
  # digest the staging repository does not know (a tag that predates this
  # pipeline) is refused too, unless the repository variable
  # PROMOTE_ALLOW_UNKNOWN is 1: set it for the first release over such tags, then
  # delete it.
  #
  # With sync-description, the only job in the `release` environment, which is
  # where the Docker Hub secrets are meant to live (an environment secret, with
  # the environment limited to `main`; repository settings, not this file).
  # Those two are the only jobs that reference them. Here they go into a
  # DOCKER_CONFIG created for the promote step and deleted with it.
  # A target whose merge never finished has no release-<target> artifact and
  # fails here. On a re-run attempt an earlier attempt's record can still be
  # there; promote-image.sh then checks it like any other (signed, staging
  # tags still on its list), so it publishes nothing unverified.
  #
  # max-parallel: Docker Hub's write limits are not the pull limit, but fifty
  # legs uploading at once is a burst for no gain -- four at a time is gentle and
  # still well inside the run's time.
  promote:
    needs: [merge, release-matrix]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    name: promote ${{ matrix.target.name }}
    environment: release
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJson(needs.release-matrix.outputs.targets) }}
    runs-on: ubuntu-24.04
    # ci/retry.sh waits 30+60+120+300+600+900 = 2010 s, plus up to 50% jitter,
    # before it gives up on one call: ~34-50 min for a single throttled registry
    # call. Room for three of those (the referrer copy and two tag writes, the
    # ones Docker Hub might throttle) plus the minutes the work itself takes.
    # Past it the job is killed, which fails closed: tags are written last, and
    # a re-run finds the copied digests in place and only moves what is left.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read # GHCR: the staged list and its referrers
    env:
      TARGET_NAME: ${{ matrix.target.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive Docker Hub image from matrix.json
        run: echo "DOCKERHUB_IMAGE=docker.io/$(jq -r .image matrix.json)" >> "$GITHUB_ENV"

      - name: Install regctl
        run: ./ci/install-regctl.sh

      - name: Download the list record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.target.name }}
          path: release

      - name: Copy the signed list to Docker Hub, then tag it
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTE_ALLOW_UNKNOWN: ${{ vars.PROMOTE_ALLOW_UNKNOWN }}
        run: |
          set -euo pipefail
          record="release/$TARGET_NAME.json"
          # The record must come from this run, this commit, and this or an
          # earlier attempt; promote-image.sh then holds the list's own run
          # annotations to it, and its staging tags to the list.
          jq -e --arg id "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --argjson attempt "$GITHUB_RUN_ATTEMPT" '
            .run_id == $id and .sha == $sha
            and (.run_attempt | test("^[0-9]+$")) and (.run_attempt | tonumber) <= $attempt' "$record" >/dev/null || {
            echo "FAIL: $record is not from run $GITHUB_RUN_ID (attempt <= $GITHUB_RUN_ATTEMPT) at $GITHUB_SHA:" >&2
            cat "$record" >&2
            exit 1
          }
          PROMOTE_RUN_ID="$(jq -r .run_id "$record")"
          PROMOTE_RUN_ATTEMPT="$(jq -r .run_attempt "$record")"
          PROMOTE_REVISION="$(jq -r .sha "$record")"
          export PROMOTE_RUN_ID PROMOTE_RUN_ATTEMPT PROMOTE_REVISION
          export DOCKER_CONFIG="$RUNNER_TEMP/promote-docker-config"
          rm -rf "$DOCKER_CONFIG"
          mkdir -m 700 "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          mapfile -t tags < <(jq -r '.tags[]' "$record")
          ./ci/promote-image.sh "$STAGE_IMAGE" "$(jq -r .list "$record")" "$DOCKERHUB_IMAGE" "${tags[@]}"

  # -------------------------------------------------------------- hub-verify
  # The list `latest` points at, verified on Docker Hub the way SECURITY.md tells
  # users to: anonymously, with cosign, against the workflow identity
  # (ci/hub-verify.sh). promote already proved by digest that every list's
  # signatures and attestations are there; this proves cosign finds and accepts
  # them there, for a handful of anonymous reads instead of hundreds.
  hub-verify:
    needs: [promote, release-matrix]
    if: ${{ !cancelled() && needs.promote.result != 'skipped' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TARGETS: ${{ needs.release-matrix.outputs.targets }}
      # Exactly the identity the merge job verifies against and SECURITY.md documents.
      COSIGN_VERIFY_FLAGS: >-
        --certificate-oidc-issuer https://token.actions.githubusercontent.com
        --certificate-identity https://github.com/LotusWebAgency/php/.github/workflows/ci.yml@refs/heads/main
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pick the list `latest` points at
        run: |
          set -euo pipefail
          image="$(jq -r .image matrix.json)"
          name="$(jq -r --arg latest "$image:latest" '[.[] | select(.tags | index($latest))][0].name // empty' <<<"$TARGETS")"
          [ -n "$name" ] || { echo "FAIL: no target is tagged $image:latest" >&2; exit 1; }
          {
            echo "DOCKERHUB_IMAGE=docker.io/$image"
            echo "CANARY=$name"
          } >> "$GITHUB_ENV"

      - name: Download its list record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ env.CANARY }}
          path: release

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install regctl
        run: ./ci/install-regctl.sh

      - name: Verify on Docker Hub, anonymously
        run: ./ci/hub-verify.sh "$DOCKERHUB_IMAGE" "release/$CANARY.json"

  # ------------------------------------------------------------ sync-description
  # Pushes DOCKERHUB.md to the Docker Hub page after a successful publish. An
  # API call with the account token, not a registry read.
  sync-description:
    needs: promote
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive Docker Hub repository from matrix.json
        run: echo "DOCKERHUB_REPO=$(jq -r .image matrix.json)" >> "$GITHUB_ENV"

      - name: Sync Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_REPO }}
          short-description: "PHP 7.0-8.5 built from source with PGO, hardened, on Debian trixie-slim"
          readme-filepath: ./DOCKERHUB.md
