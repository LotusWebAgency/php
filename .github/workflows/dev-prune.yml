# Retention for the develop images (ghcr.io/lotuswebagency/php/dev).
#
# ci.yml pushes every image that passed on develop as dev:<tag>-<sha>-<arch>,
# dev:<tag>-<sha> and the floating dev:<tag>. This deletes the versions of
# commits that are older than RETENTION_DAYS (14) and that no floating tag points
# at; the rules are in ci/ghcr_prune_dev.py. It only ever talks to the package
# `php/dev`: the name is a constant there, so the hash-pinned PGO corpora
# (`php/corpus`) that every build pulls are out of reach.
#
# Two more jobs keep caches from piling up. `prune-actions-caches` runs the shared
# cache-cleanup workflow (caches of closed pull requests and deleted branches,
# idle ones, and all but the newest php-src and Trivy DB cache per ref).
# `prune-registry-cache` clears the legacy build-cache package `php/cache`, which
# no job writes or reads any more: untagged versions older than two days, and
# tagged ones whose ISO-week suffix is neither this week nor last. Nothing else.
#
# A scheduled run deletes; a manual run is a dry run unless dry_run is switched
# off. (GitHub runs cron and lists dispatchable workflows only from the default
# branch.)
name: dev-prune

on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the plan, delete nothing
        type: boolean
        default: true

concurrency:
  group: dev-prune
  cancel-in-progress: false

permissions: {}

jobs:
  prune:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # list and delete versions of the php/dev package
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      RETENTION_DAYS: "14"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Needed by `docker buildx imagetools inspect`, which resolves the
      # children of the kept manifest lists (eight lookups at a time).
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune the dev images
        run: |
          set -euo pipefail
          args=()
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          python3 ci/ghcr_prune_dev.py "${args[@]}"

  prune-actions-caches:
    permissions:
      actions: write
      contents: read
      pull-requests: read
    uses: LotusWebAgency/docker-workflows/.github/workflows/cache-cleanup.yml@v1
    with:
      keep-newest-prefixes: "cache-trivy- php-src-"
      max-idle-days: 7
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

  prune-registry-cache:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # list and delete versions of the php/cache package
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      PACKAGE: php/cache
    steps:
      - name: Prune the legacy build cache
        run: |
          set -euo pipefail
          url="/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE//\//%2F}/versions"
          keep_weeks="$(date -u +%G-W%V) $(date -u -d '7 days ago' +%G-W%V)"
          cutoff="$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          plan="$(gh api --paginate "$url?per_page=100" | jq -s --arg weeks "$keep_weeks" --arg cutoff "$cutoff" '
            ($weeks | split(" ")) as $keep
            | [ .[][] | { id, created: .created_at, tags: (.metadata.container.tags // []) }
                | if (.tags | length) == 0 then select(.created < $cutoff) | . + { why: "untagged" }
                  elif all(.tags[]; test("-[0-9]{4}-W[0-9]{2}$") and ((capture("(?<w>[0-9]{4}-W[0-9]{2})$").w) as $w | $keep | index($w) | not))
                    then . + { why: "old week" }
                  else empty end ]')"
          echo "$(jq length <<<"$plan") versions of $PACKAGE to delete ($(jq '[.[] | select(.why == "untagged")] | length' <<<"$plan") untagged)"
          jq -r '.[] | select(.why == "old week") | "\(.id) \(.tags | join(","))"' <<<"$plan"
          if [ "$DRY_RUN" = true ]; then
            echo "dry run: nothing deleted"
            exit 0
          fi
          for id in $(jq -r '.[].id' <<<"$plan"); do
            gh api -X DELETE "$url/$id" --silent || echo "::warning::could not delete version $id"
          done
